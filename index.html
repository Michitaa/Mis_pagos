<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis gastos 🎀</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎀%3C/text%3E%3C/svg%3E">
<style>
:root{
  --rosa:#ffb6d9; --rosa-fuerte:#ff7ab8; --rosa-suave:#fff0f7; --rosa-medio:#ffd6ea;
  --rosa-texto:#c2578a; --borde:#ffc9e3; --card-borde:#ffe3f0; --texto:#4a2a3c; --gris:#9b7a8c;
  --fondo-a:#ffe6f3; --fondo-b:#f3eaff; --body-a:#fffafd; --body-b:#fbf7ff;
  --d1:#ffe0f0; --d2:#ffc2e0; --d3:#ff9fcb; --barra:#ffb8dc;
  --on:#ffffff; --lila:#b39ddb; --card-bg:#ffffff; --input-bg:#ffffff;
  --azul-bg:#e7f7ff; --azul-texto:#2a6b8a;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:"Trebuchet MS", Arial, sans-serif; color:var(--texto);
  background: var(--patron, linear-gradient(transparent,transparent)),
              radial-gradient(circle at 10% 10%, var(--fondo-a) 0, transparent 40%),
              radial-gradient(circle at 90% 30%, var(--fondo-b) 0, transparent 40%),
              linear-gradient(135deg,var(--body-a),var(--body-b));
  min-height:100vh;
}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 90px 6px 22px}
h1{margin:0;font-size:1.7rem;color:var(--rosa-texto)}
h2{margin:0 0 10px;font-size:1.1rem;color:var(--rosa-texto)}
nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
main{padding:10px 90px 40px 22px;max-width:1200px;margin:0 auto}
.btn{background:var(--btn-fondo, var(--rosa-fuerte));color:var(--on);border:none;border-radius:999px;padding:9px 16px;font:inherit;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12);text-shadow:0 1px 2px rgba(80,0,40,.55)}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.suave{background:var(--card-bg);color:var(--rosa-texto);border:2px solid var(--borde);box-shadow:none}
.btn.peq{padding:5px 10px;font-size:.85rem}
.ico{display:none;width:26px;height:26px;vertical-align:middle;margin-right:2px;object-fit:contain;filter:drop-shadow(0 0 4px rgba(255,45,149,.7))}
body.scene .ico{display:inline-block}
body.scene .emo{display:none}
/* ===== Messenger 2000s: cursor de cristal y UI transparente (solo este tema) ===== */
body.msn .btn{background:linear-gradient(180deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 50%, rgba(0,50,110,.08) 51%, rgba(0,50,110,.12) 100%), rgba(40,130,205,.78); color:#ffffff; text-shadow:0 1px 2px rgba(0,40,85,.5); border:1px solid rgba(255,255,255,.7); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); box-shadow:0 4px 14px rgba(20,100,170,.25)}
body.msn .btn.suave{background:linear-gradient(180deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,.1) 50%), rgba(255,255,255,.55); color:#0f4a7e; text-shadow:none}
body.msn .chip{background:rgba(40,130,205,.6); color:#ffffff; border:1px solid rgba(255,255,255,.7); text-shadow:0 1px 2px rgba(0,40,85,.5)}
body.msn .chip.on{background:rgba(20,100,180,.85)}
body.msn .opc{background:rgba(40,130,205,.7); color:#fff; text-shadow:0 1px 2px rgba(0,40,85,.45)}
body.msn .opc.on{background:rgba(20,100,180,.9); border-color:#fff}
body.msn .opc i{border-color:#fff}
body.msn .btn.nav-on{background:linear-gradient(180deg, rgba(255,255,255,.9) 0%, rgba(255,255,255,.25) 47%, rgba(90,190,255,.15) 53%, rgba(90,190,255,.45) 100%), rgba(160,225,255,.55)}
body.msn .card{background:rgba(255,255,255,.5); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.85)}
body.msn .total{background:linear-gradient(180deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 50%), rgba(90,190,255,.45); color:#06365e; text-shadow:0 1px 0 rgba(255,255,255,.7); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
body.msn .item, body.msn .sub-fila, body.msn .dia, body.msn .chip{background:rgba(255,255,255,.4)}
body.msn input, body.msn select{background:rgba(255,255,255,.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px)}
body.msn .lado{background:rgba(255,255,255,.45); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
body.msn .sugs, body.msn .modal, body.msn .burbuja{background:rgba(255,255,255,.7); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
/* ajustes finales de Messenger: días seleccionados y meses de Fijos legibles */
body.msn .dia.sel{background:rgba(30,120,200,.88); color:#ffffff; border-color:#ffffff}
body.msn .dia.sel small{color:#ffffff}
body.msn .chip{background:rgba(255,255,255,.65); color:#15578f; border:1px solid rgba(40,130,205,.55); text-shadow:none}
body.msn .chip.on{background:rgba(30,120,200,.9); color:#ffffff; border-color:#ffffff; text-shadow:0 1px 2px rgba(0,40,85,.5)}
/* Messenger con modo oscuro: cristal oscuro y letras claras */
body.oscuro.msn .card, body.oscuro.msn .lado, body.oscuro.msn .sugs, body.oscuro.msn .modal, body.oscuro.msn .burbuja{background:rgba(24,18,34,.82)!important; border-color:rgba(160,200,255,.28)!important; color:#f3e8f5}
body.oscuro.msn .item, body.oscuro.msn .sub-fila, body.oscuro.msn .dia, body.oscuro.msn .chip{background:rgba(255,255,255,.08)!important; color:#f3e8f5}
body.oscuro.msn .dia.sel{background:rgba(40,140,230,.9)!important; color:#fff!important}
body.oscuro.msn .chip.on{background:rgba(40,130,205,.8)!important; color:#fff!important; border-color:#9fd8ff!important}
body.oscuro.msn .total{background:rgba(40,130,205,.35)!important; color:#eaf6ff!important; text-shadow:none}
body.oscuro.msn input, body.oscuro.msn select{background:rgba(255,255,255,.08)!important; color:#f3e8f5!important}
body.oscuro.msn .btn.suave{background:rgba(255,255,255,.12)!important; color:#eaf6ff!important}
body.oscuro.msn .opc{background:rgba(40,130,205,.45)!important; color:#fff!important}
body.oscuro.msn h2, body.oscuro.msn .titulo, body.oscuro.msn .vacio-msg, body.oscuro.msn label{color:#cfe8ff!important}
body.oscuro.msn .lado .lbtn{background:rgba(255,255,255,.1)!important}
/* botones de navegación: brillo tipo botón de gel; la sección activa resalta con un halo, sin ponerse blanca */
nav .btn{
  background: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 48%, rgba(0,0,0,.2) 52%, rgba(0,0,0,0) 100%), var(--btn-fondo, var(--rosa-fuerte));
  border:1px solid rgba(255,255,255,.35);
  transition: box-shadow .2s, transform .15s;
}
.btn.nav-on{
  box-shadow: 0 0 0 2px var(--rosa-fuerte), 0 0 0 4px rgba(255,255,255,.55), 0 0 18px var(--rosa-fuerte);
  transform: translateY(-2px);
  filter: brightness(1.2) saturate(1.15);
}
.btn.peligro{background:var(--card-bg);color:#b0306a;border:2px solid #ffb0d2;box-shadow:none}
.btn.campana{background:var(--card-bg);border:2px solid var(--borde);color:var(--texto);font-size:1.2rem;padding:6px 12px;box-shadow:none}
.card{background:var(--card-bg);border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.06);border:2px solid var(--card-borde);margin-bottom:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
input,select{font:inherit;border:2px solid var(--borde);border-radius:12px;padding:8px 10px;background:var(--input-bg);color:var(--texto);min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--rosa-fuerte);flex:0 0 auto}
input:focus,select:focus{outline:none;border-color:var(--rosa-fuerte)}
label{font-size:.85rem;color:var(--gris);display:block;margin-bottom:4px}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.form > div{display:flex;flex-direction:column;flex:1 1 140px}
.hint{font-size:.85rem;color:var(--rosa-texto);margin-top:8px;min-height:1.2em;width:100%}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.monthbar .titulo{font-size:1.4rem;font-weight:bold;color:var(--rosa-texto)}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dh{text-align:center;font-size:.75rem;color:var(--gris);font-weight:bold;padding:4px 0}
.dia{position:relative;border:2px solid transparent;background:var(--rosa-suave);border-radius:14px;min-height:58px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;color:var(--texto)}
.dia:hover{border-color:var(--borde)}
.dia b{font-size:1rem}
.dia small{font-size:.7rem;color:var(--rosa-texto);margin-top:2px;font-weight:bold}
.dia.vacio{background:transparent;cursor:default;border:none}
.dia.hoy{outline:2px dashed var(--lila);outline-offset:-4px}
.dia.sel{background:var(--rosa-fuerte);color:var(--on)}
.dia.sel small{color:var(--on)}
.dia.sel:hover{border-color:transparent}
.dia.gasto{background:var(--d1)}
.dia.gasto2{background:var(--d2)}
.dia.gasto3{background:var(--d3)}
.mini .dia{min-height:30px;padding:2px;border-radius:10px;cursor:pointer}
.mini .dia b{font-size:.8rem}
.mini .dh{font-size:.6rem;padding:0}
.mini{gap:3px}
.pt{width:5px;height:5px;border-radius:50%;background:var(--rosa-fuerte);display:block;margin-top:1px}
.dia.sel .pt{background:var(--on)}
/* listas */
.item{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;border-radius:14px;background:var(--rosa-suave);margin-bottom:8px;flex-wrap:wrap}
.item .desc{font-weight:bold;flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item .monto{font-weight:bold;color:var(--rosa-texto);white-space:nowrap}
.item .cat{font-size:.85rem;color:var(--rosa-texto);font-weight:bold}
.badge{display:inline-block;font-size:.72rem;background:var(--azul-bg);color:var(--azul-texto);border-radius:999px;padding:2px 8px;font-weight:bold;margin-left:4px;vertical-align:middle}
.vacio-msg{color:var(--gris);font-style:italic;padding:8px 2px}
.total{font-size:1.2rem;font-weight:bold;color:var(--on);background:var(--total-fondo, linear-gradient(90deg,var(--rosa),var(--rosa-fuerte)));border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:6px}
.total.suave{background:var(--azul-bg);color:var(--azul-texto)}
.barra{margin-bottom:12px}
.barra .fila{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:4px;flex-wrap:wrap;gap:4px}
.barra .fondo{background:var(--rosa-suave);border-radius:999px;height:14px;overflow:hidden}
.barra .relleno{height:100%;background:linear-gradient(90deg,var(--barra),var(--rosa-fuerte));border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.subtit{font-size:1rem;margin:16px 0 8px;color:var(--texto)}
.chk{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--borde);background:var(--card-bg);border-radius:999px;padding:3px 10px;font-size:.85rem;cursor:pointer;color:var(--texto)}
.chk input{width:auto;margin:0;accent-color:var(--rosa-fuerte)}
.interruptor{display:flex;align-items:center;gap:8px;font-weight:bold;cursor:pointer}
.interruptor input{width:18px;height:18px;margin:0;accent-color:var(--rosa-fuerte)}
ul.ayuda{margin:0 0 10px;padding-left:24px;line-height:1.6;font-size:1.08rem}
ul.ayuda li{margin-bottom:8px}
.modal .subtit{font-size:1.2rem;margin:20px 0 10px}
.modal h2{font-size:1.35rem}
.chip{border:2px solid var(--borde);background:var(--card-bg);border-radius:999px;padding:3px 9px;font:inherit;font-size:.8rem;cursor:pointer;color:var(--gris)}
.chip.on{background:var(--rosa-fuerte);border-color:var(--rosa-fuerte);color:var(--on);font-weight:bold}
.anio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{background:var(--card-bg);border-radius:20px;padding:12px;border:2px solid var(--card-borde);box-shadow:0 6px 18px rgba(0,0,0,.05)}
.mcard .mt{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mcard .mt button{background:none;border:none;font:inherit;font-weight:bold;color:var(--rosa-texto);cursor:pointer;font-size:1rem;padding:0}
.mcard .mt span{font-size:.8rem;color:var(--rosa-texto);font-weight:bold}
.mcard.actual{border-color:var(--rosa-fuerte)}
.sub-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.sub-form > div{display:flex;flex-direction:column}
.sub-fila{background:var(--rosa-suave);border-radius:16px;padding:12px;margin-bottom:10px}
.sub-fila .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.acciones{display:flex;gap:6px;flex-wrap:wrap}
.seleccion{display:flex;align-items:center;gap:8px;cursor:pointer;flex:0 0 auto}
.meta-barra{background:var(--rosa-suave);border-radius:999px;height:22px;overflow:hidden;margin:10px 0 4px}
.meta-barra div{height:100%;background:var(--meta-fondo, linear-gradient(90deg,var(--barra),var(--rosa-fuerte)));border-radius:999px;transition:width .4s}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--card-borde);text-align:left}
th{color:var(--rosa-texto)}
td.num,th.num{text-align:right;white-space:nowrap}
.sube{color:#e0245e;font-weight:bold}
.baja{color:#1aa86b;font-weight:bold}
/* barra lateral derecha: colores y herramientas */
.lado{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card-bg);border:2px solid var(--card-borde);border-radius:999px;padding:14px 8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:10}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid #fff;cursor:pointer;padding:0;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.sw.on{outline:3px solid var(--rosa-texto);outline-offset:1px}
.sep{width:22px;border:none;border-top:2px solid var(--borde);margin:4px 0}
/* sugerencias al escribir una descripción */
.sugs{position:absolute;left:0;right:0;top:100%;z-index:5;margin-top:4px;background:var(--card-bg);border:2px solid var(--borde);border-radius:14px;padding:4px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 24px rgba(0,0,0,.14)}
.sugs:empty{display:none}
.sug{text-align:left;border:none;background:none;font:inherit;color:var(--texto);padding:7px 10px;border-radius:10px;cursor:pointer}
.sug.on{background:var(--rosa-fuerte);color:var(--on);font-weight:bold}
/* burbuja de colores, sale a la izquierda del icono */
.burbuja{position:absolute;right:calc(100% + 14px);top:50%;transform:translateY(-50%);background:var(--card-bg);border:2px solid var(--card-borde);border-radius:22px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px;min-width:200px}
.burbuja::after{content:"";position:absolute;right:-10px;top:50%;transform:translateY(-50%);border:9px solid transparent;border-right:0;border-left-color:var(--card-borde)}
.burbuja-tit{color:var(--rosa-texto);font-size:.95rem;margin-bottom:2px}
.opc{display:flex;align-items:center;gap:8px;border:2px solid transparent;background:var(--rosa-suave);border-radius:12px;padding:6px 10px;font:inherit;color:var(--texto);cursor:pointer;text-align:left}
.opc:hover{border-color:var(--borde)}
.opc i{width:18px;height:18px;border-radius:50%;display:inline-block;border:2px solid #fff;flex:0 0 auto}
.opc.on{border-color:var(--rosa-texto);font-weight:bold}
@media (max-width:700px){
  .burbuja{right:50%;top:auto;bottom:calc(100% + 14px);transform:translateX(50%)}
  .burbuja::after{display:none}
}
.lbtn{background:none;border:none;font-size:1.15rem;cursor:pointer;padding:4px;border-radius:50%}
.lbtn:hover{background:var(--rosa-suave)}
@media (max-width:700px){
  header{padding-right:22px}
  main{padding-right:22px;padding-bottom:90px}
  .lado{top:auto;bottom:12px;right:50%;transform:translateX(50%);flex-direction:row;border-radius:999px;flex-wrap:wrap;justify-content:center;max-width:94vw}
  .sep{width:2px;height:22px;border:none;border-left:2px solid var(--borde);margin:0 4px}
}
.overlay{position:fixed;inset:0;background:rgba(20,10,25,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay.abierto{display:flex}
.modal{background:var(--card-bg);color:var(--texto);border-radius:22px;padding:24px;max-width:min(760px,94vw);width:100%;max-height:90vh;overflow:auto;border:2px solid var(--card-borde);box-shadow:0 20px 50px rgba(0,0,0,.3)}
svg text{font-family:"Trebuchet MS",Arial,sans-serif}
.msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--rosa-fuerte);color:var(--on);padding:10px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:none;z-index:30}
@media print{
  nav, .lado, form, .hint, #msg, .monthbar button, .no-print, .overlay, .seleccion{display:none !important}
  body{background:#fff !important}
  main{padding:0}
  .card{box-shadow:none;break-inside:avoid}
}

/* Cursores de los temas de pago (solo con mouse) + estela de estrellitas / burbujas */
.cur-tema{position:fixed;left:0;top:0;pointer-events:none;z-index:10000;display:none;opacity:0;transition:opacity .15s}
.cur-tema.visible{opacity:1}
#cur-scene{width:56px;height:44px;margin:-22px 0 0 -28px}
#cur-scene img{position:absolute;inset:0;width:100%;height:100%;display:block}
#cur-msn{width:30px;height:38px;margin:-2px 0 0 -3px;filter:drop-shadow(0 2px 3px rgba(0,60,120,.35))}
#cur-msn .brillo{transform-box:fill-box;transform-origin:center;animation:titilar 2.2s ease-in-out infinite}
@keyframes titilar{0%,100%{opacity:.25;transform:scale(.6) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
#estela{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:none}
body.scene #estela, body.msn #estela{display:block}
@media (hover:hover) and (pointer:fine){
  body.scene, body.scene *, body.msn, body.msn *{cursor:none !important}
  body.scene #cur-scene, body.msn #cur-msn{display:block}
}
body.scene #cur-ojos{animation:voltear-ojos 4s step-end infinite}
@keyframes voltear-ojos{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
body.sin-efectos #cur-ojos, body.sin-efectos #cur-msn .brillo{animation:none}
body.sin-efectos #estela{display:none !important}
/* Banda de vista previa de temas de pago */
#banda-preview{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:30;display:none;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap;
  background:var(--card-bg);color:var(--texto);border:2px solid var(--rosa-fuerte);border-radius:18px;padding:6px 6px 6px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:bold;font-size:.92rem;max-width:calc(100vw - 16px)}
#banda-preview .txt{overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){#banda-preview{font-size:.8rem;gap:5px;padding-left:10px}#banda-preview .btn{padding:5px 9px}}
#banda-preview.on{display:flex}
#banda-preview .seg{display:inline-block;flex:0 0 auto;min-width:2.4em;text-align:center;background:var(--rosa-fuerte);color:var(--on);border-radius:999px;padding:1px 8px}
#banda-preview .btn{padding:6px 12px;flex:0 0 auto}
@media print{#banda-preview,.cur-tema,#estela{display:none !important}}
</style>
</head>
<body>
<header>
  <h1>🎀 Mis gastos</h1>
  <nav>
    <button class="btn" data-act="vista" data-v="anio">Año</button>
    <button class="btn" data-act="vista" data-v="mes">Mes</button>
    <button class="btn" data-act="vista" data-v="todos">Gastos</button>
    <button class="btn" data-act="vista" data-v="fijos">Fijos</button>
    <button class="btn" data-act="vista" data-v="ahorro">Ahorro</button>
    <button class="btn" data-act="vista" data-v="comp">Gráfica</button>

/* ===================== Utilidades ===================== */
function pad(n){ return String(n).padStart(2, "0"); }
function iso(y, m, d){ return `${y}-${pad(m)}-${pad(d)}`; }
function diasEnMes(y, m){ return new Date(y, m, 0).getDate(); }
function addMeses(fecha, k){
  const [y, m, d] = fecha.split("-").map(Number);
  const total = m - 1 + k;
  const ny = y + Math.floor(total / 12), nm = (total % 12) + 1;
  return iso(ny, nm, Math.min(d, diasEnMes(ny, nm)));
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function catAuto(desc){
  const d = norm(desc);
  if(!d) return "";
  let aprendida = null, la = 0;
  for(const g of S.gastos){
    if(!g.cat) continue;
    const k = norm(g.desc);
    if(k && d.includes(k) && k.length > la){ aprendida = g.cat; la = k.length; }
  }
  if(aprendida) return aprendida;
  let kc = null, kl = 0;
  for(const [k, c] of Object.entries(kwMapa())){
    const kk = norm(k);
    if(kk && d.includes(kk) && kk.length > kl){ kc = c; kl = kk.length; }
  }
  return kc || "Sin categoría";
}

/* ===================== Cálculos ===================== */
/* Gastos que se repiten (diarios o semanales): se calculan cada día según su regla */

  const [y, m, d] = f.split("-").map(Number);

  return (S.rutinas || []).filter(r => r.frec === "diario" || (r.frec === "semanal" && Number(r.dia) === wd))

}

  const out = [];
  for(let d = 1; d <= diasEnMes(S.anio, m); d++) out.push(...rutinasDia(iso(S.anio, m, d)));
  return out;
}

/* "Otro" = lo pagó una persona de la casa que no soy yo */
const esOtro = x => !!x.quien && x.quien !== "Yo";
const esMio = x => !esOtro(x);

function fijosDelDia(f){
  const [y, m, d] = f.split("-").map(Number);

function subOtros(s){ return num(s.monto) - subMio(s); }

}
/* Porcentaje que le toca a cada persona en las cuentas de casa */
function porcentajes(personas){
  const guardado = S.reparto.pct || {};

  const suma = vals.reduce((a, x) => a + (num(x)), 0);
  const out = {};
  if(vals.every(x => typeof x === "number") && Math.abs(suma - 100) < 0.5) personas.forEach(p => out[p] = guardado[p]);
  else personas.forEach(p => out[p] = 100 / personas.length);
  return out;
}
function totalDiaMio(f){ return sumar(gastosDia(f).filter(esMio)) + fijosDelDia(f).reduce((a, s) => a + subMio(s), 0); }
function varMio(m){ return sumar(gastosMes(m).filter(esMio)); }
function varOtros(m){ return sumar(gastosMes(m).filter(esOtro)); }

function fijosOtros(m){ return subsActivos(m).reduce((a, s) => a + subOtros(s), 0); }
function totalMes(m){ return varMio(m) + fijosMio(m); }
function casaMes(m){ return varOtros(m) + fijosOtros(m); }
/* Total de todo: lo tuyo + lo que pagaron otras personas */
function totalTodoMes(m){ return sumar(gastosMes(m)) + sumar(subsActivos(m)); }
function totalesCatsMio(m){

}

/* Sueldo: se repite cada mes desde que lo agregas; se puede pausar */
function sueldoActivo(s, m){
  const k = S.anio * 100 + m;
  return k >= s.anioDesde * 100 + s.mesDesde && !(s.hasta && k > s.hasta) && !(s.pausas || []).includes(S.anio + "-" + m);
}
function sueldosMes(m){ return S.sueldos.filter(s => sueldoActivo(s, m)); }
function totalIngresosMes(m){ return sumar(ingresosMes(m)) + sumar(sueldosMes(m)); }
function hoyIso(){ return iso(hoy.getFullYear(), hoy.getMonth() + 1, hoy.getDate()); }

/* Ahorro: lo que te sobra cada mes (ingresos − lo tuyo) y lo acumulado */
function ahorroDatos(){
  const mesActual = S.anio === hoy.getFullYear() ? hoy.getMonth() + 1 : 12;
  let acum = 0;
  const filas = [];
  for(let m = 1; m <= 12; m++){
    const ing = totalIngresosMes(m);
    if(m > mesActual && ing === 0) continue;
    const gas = totalMes(m);
    const sobra = ing - gas;
    acum += sobra;
    filas.push({m, ing, gas, sobra, acum});
  }
  return {filas, acum};
}

/* ===================== Calendario ===================== */
function calendario(y, m, mini){
  const primero = new Date(y, m - 1, 1);
  const offset = (primero.getDay() + 6) % 7;
  const dim = diasEnMes(y, m);
  let celdas = "";
  for(let i = 0; i < 42; i++){
    const d = i - offset + 1;
    if(d < 1 || d > dim){ celdas += `<div class="dia vacio"></div>`; continue; }
    const f = iso(y, m, d);
    const t = totalDiaMio(f);
    const clases = ["dia"];
    if(f === ui.dia) clases.push("sel");
    if(f === hoyIso()) clases.push("hoy");
    if(!mini && t > 0) clases.push(t >= 150 ? "gasto3" : t >= 60 ? "gasto2" : "gasto");
    if(mini){
      celdas += `<button class="${clases.join(" ")}" data-act="ir-mes-dia" data-f="${f}">
        <b>${d}</b>${t > 0 ? '<i class="pt"></i>' : ''}</button>`;
    } else {
      celdas += `<button class="${clases.join(" ")}" data-act="dia" data-f="${f}">
        <b>${d}</b><small>${t > 0 ? corto(t) : ""}</small></button>`;
    }
  }
  return `<div class="cal${mini ? " mini" : ""}">${DIAS.map(d => `<div class="dh">${d}</div>`).join("")}${celdas}</div>`;
}

function fechaLarga(f){
  const [y, m, d] = f.split("-").map(Number);
  const dias = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  return `${dias[new Date(y, m - 1, d).getDay()]} ${d} de ${MESES[m - 1]}`;
}

/* ===================== Formularios y elementos ===================== */

  const editar = modo === "editar";
  const y = S.anio;
  const f = editar ? g.fecha : fechaDefault;
  return `<form class="form" data-form="${editar ? "editgasto" : "gasto"}" ${editar ? `data-id="${g.id}"` : ""}>
    <div><label>Fecha</label><input type="date" name="fecha" value="${f}" min="${y}-01-01" max="${y}-12-31" required></div>
    <div style="flex:2 1 200px;position:relative"><label>Descripción</label><input name="desc" value="${editar ? esc(g.desc) : ""}" required autocomplete="off"><div class="sugs"></div></div>
    <div><label>${editar ? "Monto (S/)" : "Monto por mes (S/)"}</label><input name="monto" type="number" step="0.01" min="0" value="${editar ? num(g.monto) : ""}" required></div>
    <div><label>Categoría</label><select name="cat"><option value="">Automática</option>${opcionesCats(editar ? g.cat : "")}</select></div>
    ${editar ? "" : `<div><label>Meses (cuotas)</label><input name="cuotas" type="number" min="1" max="36" value="1"></div>`}
    <div><label>¿Quién lo pagó?</label><select name="quien">${opcionesQuien(editar ? g.quien : "")}</select></div>
    <button class="btn" type="submit">${editar ? "Guardar cambios ✏️" : "Guardar 🎀"}</button>
    ${editar ? `<button class="btn suave" type="button" data-act="cancel-gasto">Cancelar</button>` : ""}
  </form>${editar ? "" : `<div class="hint" id="hint"></div>`}`;
}

function itemGasto(g){
  if(g.rutina){
    return `<div class="item"><span class="desc">🔄 ${esc(g.desc)} <span class="badge">se repite</span></span>
      <span class="monto">${soles(g.monto)}</span></div>`;
  }
  if(ui.editGasto === g.id){
    return `<div class="item" style="display:block">${gastoFormHTML(g, "editar")}</div>`;
  }
  return `<div class="item">
    <div style="flex:1 1 170px;min-width:0">
      <div class="desc">${esc(g.desc)} ${esOtro(g) ? `<span class="badge">👥 pagó ${esc(g.quien)}</span>` : ""}</div>
      <small style="color:var(--gris)">${esc(fechaLarga(g.fecha))}</small>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">
        <select data-chg="cat" data-id="${g.id}" style="font-size:.85rem">
          <option value="">Categoría: automática (${esc(catAuto(g.desc) || "—")})</option>
          ${opcionesCats(g.cat)}
        </select>
        <select data-chg="quien" data-tipo="gasto" data-id="${g.id}" style="font-size:.85rem">${opcionesQuien(g.quien)}</select>
      </div>
    </div>
    <span class="monto">${soles(g.monto)}</span>
    <div class="acciones">
      <button class="btn suave peq" data-act="edit-gasto" data-id="${g.id}">✏️</button>
      <button class="btn peligro peq" data-act="del-gasto" data-id="${g.id}">🗑️</button>
    </div>
  </div>`;
}

/* Lista de lo pagado por otras personas, con casilla para sumar selección */
function listaOtros(items){
  if(!items.length) return `<div class="vacio-msg">No hay gastos pagados por otras personas.</div>`;
  const seleccionados = items.filter(x => ui.sel[x.id]);
  const totalSel = sumar(seleccionados);
  return `
    ${items.map(x => `<div class="item">
      <label class="seleccion">
        <input type="checkbox" data-chg="sel" data-id="${x.id}" ${ui.sel[x.id] ? "checked" : ""}>
      </label>
      <span class="desc">${esc(x.desc)}<br><small style="color:var(--gris)">${esc(x.sub)}</small></span>
      <span class="monto">${soles(x.monto)}</span>
    </div>`).join("")}
    <div class="total suave"><span>Seleccionados (${seleccionados.length})</span><span>${soles(totalSel)}</span></div>
    ${seleccionados.length ? `<div class="acciones no-print" style="margin-top:6px"><button class="btn suave peq" data-act="limpiar-sel">Quitar selección</button></div>` : ""}`;
}

function barraCat(c, gastado, presu){
  const pct = presu > 0 ? gastado / presu * 100 : (gastado > 0 ? 100 : 0);
  const color = presu > 0 ? (pct > 100 ? "#e0245e" : pct >= 80 ? "#f5a300" : "") : "";
  const texto = presu > 0 ? `${soles(gastado)} de ${soles(presu)}` : soles(gastado);
  const aviso = presu > 0 ? (pct > 100 ? " · ¡te pasaste! 😬" : pct >= 80 ? " · cuidado ⚠️" : "") : "";
  return `<div class="barra"><div class="fila"><span>${esc(c)}${aviso}</span><b>${texto}</b></div>
    <div class="fondo"><div class="relleno" style="width:${Math.min(pct, 100).toFixed(1)}%;${color ? `background:${color}` : ""}"></div></div></div>`;
}

/* ===================== Vistas ===================== */
function vistaMes(){
  const m = ui.mes, y = S.anio;
  if(ui.dia && !ui.dia.startsWith(`${y}-${pad(m)}-`)) ui.dia = null;
  const fechaForm = ui.dia || iso(y, m, 1);
  const deDia = ui.dia ? gastosDia(ui.dia) : [];
  const fijosDia = ui.dia ? fijosDelDia(ui.dia) : [];
  const cats_m = totalesCatsMio(m);
  const presu = S.presupuesto || {};
  const lista = catsTodas().filter(c => (cats_m[c] || 0) > 0 || presu[c] > 0);
  const barras = lista.sort((a, b) => (cats_m[b] || 0) - (cats_m[a] || 0))
    .map(c => barraCat(c, cats_m[c] || 0, presu[c] || 0)).join("")
    || `<div class="vacio-msg">Aún no hay gastos tuyos este mes 🌷</div>`;

  const panelDia = !ui.dia
    ? `<div class="vacio-msg">Toca un día del calendario para ver sus gastos 🌸</div>`
    : ((deDia.length || fijosDia.length)
        ? fijosDia.map(s => `<div class="item"><span class="desc">🔁 ${esc(s.nombre)}<br><small style="color:var(--gris)">gasto fijo${esOtro(s) ? " · pagó " + esc(s.quien) : ""}</small></span><span class="monto">${soles(s.monto)}</span></div>`).join("") + deDia.map(itemGasto).join("")
        : `<div class="vacio-msg">Ese día no hay gastos ✨</div>`);

  const fijos = S.subs.some(s => s.nombre)
    ? S.subs.filter(s => s.nombre).map(s => {
        const pagado = !(s.pausas || []).includes(m);
        return `<div class="item"><span class="desc">${esc(s.nombre)} ${badgeSub(s)}</span>
          <span class="monto">${soles(s.monto)}</span>
          <button class="chip ${pagado ? "on" : ""}" data-act="toggle-pago" data-id="${s.id}" data-m="${m}">
            ${pagado ? "✔ este mes" : "✖ no este mes"}</button></div>`;
      }).join("")
    : `<div class="vacio-msg">No tienes gastos fijos. Agrégalos en 🔁 Fijos.</div>`;

  const itemsOtros = [
    ...gastosMes(m).filter(esOtro).map(g => ({id: g.id, desc: g.desc, monto: g.monto, sub: `${fechaLarga(g.fecha)} · ${catDe(g)} · pagó ${g.quien}`})),
    ...subsActivos(m).filter(s => esOtro(s) && !esComp(s)).map(s => ({id: s.id, desc: s.nombre, monto: s.monto, sub: `mensual · pagó ${s.quien}`})),
    ...subsActivos(m).filter(s => esComp(s) && subOtros(s) > 0).map(s => ({id: s.id + "_c", desc: s.nombre + " (parte de otros)", monto: subOtros(s), sub: `en conjunto · ${s.entre.join(", ")}`}))
  ];

  const ing = [...ingresosMes(m)].sort((a, b) => String(a.fecha || "").localeCompare(String(b.fecha || "")));
  const totIng = totalIngresosMes(m);
  const saldo = totIng - totalMes(m);
  const ingHTML = ing.map(i => ui.editIng === i.id
    ? `<form class="form" data-form="editingreso" data-id="${i.id}" style="margin-bottom:8px">
        <div><label>Fecha</label><input type="date" name="fecha" value="${esc(i.fecha || "")}" required></div>
        <div style="flex:2 1 160px"><label>Descripción</label><input name="desc" value="${esc(i.desc)}" required></div>
        <div><label>Monto (S/)</label><input name="monto" type="number" step="0.01" min="0" value="${num(i.monto)}" required></div>
        <button class="btn" type="submit">Guardar ✏️</button>
        <button class="btn suave" type="button" data-act="cancel-edit-ing">Cancelar</button></form>`
    : `<div class="item"><span class="desc">${esc(i.desc)}${i.fecha ? `<br><small style="color:var(--gris)">${esc(fechaLarga(i.fecha))}</small>` : ""}</span><span class="monto">${soles(i.monto)}</span>
    <button class="btn suave peq" data-act="edit-ingreso" data-id="${i.id}" title="Editar">✏️</button>
    <button class="btn peligro peq" data-act="del-ingreso" data-id="${i.id}">🗑️</button></div>`).join("")
    || `<div class="vacio-msg">No hay ingresos extra este mes.</div>`;
  const kMes = y * 100 + m;
  const sueldosVis = S.sueldos.filter(s => kMes >= s.anioDesde * 100 + s.mesDesde);
  const sueldoHTML = sueldosVis.map(s => {
    const terminado = s.hasta && kMes > s.hasta;
    const activo = sueldoActivo(s, m);
    if(ui.editSue === s.id) return `<form class="form" data-form="editsueldo" data-id="${s.id}" style="margin-bottom:8px">
        <div style="flex:2 1 160px"><label>Descripción</label><input name="desc" value="${esc(s.desc)}" required></div>
        <div><label>Monto mensual (S/)</label><input name="monto" type="number" step="0.01" min="0" value="${num(s.monto)}" required></div>
        <button class="btn" type="submit">Guardar ✏️</button>
        <button class="btn suave" type="button" data-act="cancel-edit-sue">Cancelar</button></form>`;
    return `<div class="item"><span class="desc">${esc(s.desc)}<br><small style="color:var(--gris)">${terminado ? "terminado ⏹" : "cada mes"}</small></span>
      <span class="monto">${soles(s.monto)}</span>
      ${terminado
        ? `<button class="btn suave peq" data-act="reactivar-sueldo" data-id="${s.id}">▶ Reactivar</button>`
        : `<button class="chip ${activo ? "on" : ""}" data-act="toggle-sueldo" data-id="${s.id}" data-m="${m}">${activo ? "✔ este mes" : "✖ no este mes"}</button>
           <button class="btn suave peq" data-act="fin-sueldo" data-id="${s.id}" title="Ya no recibo este sueldo">⏹ Terminar</button>`}
      <button class="btn suave peq" data-act="edit-sueldo" data-id="${s.id}" title="Editar">✏️</button>
      <button class="btn peligro peq" data-act="del-sueldo" data-id="${s.id}">🗑️</button></div>`;
  }).join("") || `<div class="vacio-msg">No tienes sueldo anotado. Si recibes uno, agrégalo aquí y se sumará solo cada mes.</div>`;

  return `
  <div class="monthbar">
    <button class="btn suave" data-act="mes-prev">◀</button>
    <div class="titulo">${MESES[m - 1]} ${y}</div>
    <button class="btn suave" data-act="mes-next">▶</button>
  </div>
  <div class="grid2">
    <div>
      <div class="card">
        <h2>Calendario</h2>
        ${calendario(y, m, false)}
        <div class="total"><span>Lo que pagas tú este mes</span><span>${soles(totalMes(m))}</span></div>
        <div class="total suave"><span>Total de todo (incluye otros)</span><span>${soles(totalTodoMes(m))}</span></div>
      </div>
      <div class="card">
        <h2>➕ Agregar gasto</h2>
        ${gastoFormHTML(null, "nuevo", fechaForm)}
      </div>
      <div class="card">
        <h2>💵 Ingresos y ahorro</h2>
        <h3 class="subtit">💼 Sueldo (se repite cada mes)</h3>
        ${sueldoHTML}
        <form class="form" data-form="sueldo" data-mes="${m}" style="margin-top:10px">
          <div style="flex:2 1 160px"><label>Descripción</label><input name="desc" required placeholder="ej: sueldo"></div>
          <div><label>Monto mensual (S/)</label><input name="monto" type="number" step="0.01" min="0" required></div>
          <button class="btn" type="submit">Agregar sueldo 💼</button>
        </form>
        <h3 class="subtit">🎁 Ingresos extra (con fecha)</h3>
        ${ingHTML}
        <form class="form" data-form="ingreso" style="margin-top:10px">
          <div><label>Fecha</label><input type="date" name="fecha" value="${fechaForm}" min="${y}-01-01" max="${y}-12-31" required></div>
          <div style="flex:2 1 160px"><label>Descripción</label><input name="desc" required placeholder="ej: me dio mi tía, venta, ajuste"></div>
          <div><label>Monto (S/)</label><input name="monto" type="number" step="0.01" min="0" required></div>
          <button class="btn" type="submit">Agregar 💵</button>
        </form>
        <div class="total"><span>Ingresos del mes</span><span>${soles(totIng)}</span></div>
        <div class="total suave"><span>${saldo >= 0 ? "Te sobra este mes" : "Te faltan"}</span><span style="color:${saldo >= 0 ? "#1aa86b" : "#e0245e"}">${soles(Math.abs(saldo))}</span></div>
      </div>
    </div>
    <div>
      <div class="card">
        <h2>📌 ${ui.dia ? esc(fechaLarga(ui.dia)) : "Gastos del día"}</h2>
        ${panelDia}
        ${ui.dia ? `<div class="total"><span>Tuyo ese día</span><span>${soles(totalDiaMio(ui.dia))}</span></div>` : ""}
      </div>
      <div class="card">
        <h2>🌷 Tus gastos por categoría</h2>
        ${barras}
      </div>
      <div class="card">
        <h2>🔁 Gastos fijos de este mes</h2>
        ${fijos}
        <div class="total"><span>Subtotal fijos tuyos</span><span>${soles(fijosMio(m))}</span></div>
      </div>
      <div class="card">
        <h2>👥 Pagados por otras personas</h2>
        <p class="vacio-msg" style="margin:0 0 8px">No se suman a tu total. Marca con la casilla los que quieras sumar.</p>
        ${listaOtros(itemsOtros)}
        <div class="total suave"><span>Total pagado por otros</span><span>${soles(casaMes(m))}</span></div>
      </div>
      <div class="card no-print">
        <h2>⬇️ Exportar este mes</h2>
        <div class="acciones">
          <button class="btn suave" data-act="csv-mes">⬇️ Descargar Excel</button>
          <button class="btn suave" data-act="resumen-pdf">📄 Descargar resumen PDF</button>
        </div>
      </div>
    </div>
  </div>`;
}

function vistaAnio(){
  const y = S.anio;
  const totalTu = Array.from({length: 12}, (_, i) => totalMes(i + 1)).reduce((a, b) => a + b, 0);
  const totalTodo = Array.from({length: 12}, (_, i) => totalTodoMes(i + 1)).reduce((a, b) => a + b, 0);
  const {acum} = ahorroDatos();
  const cards = MESES.map((nombre, i) => {
    const m = i + 1;
    const actual = (hoy.getFullYear() === y && hoy.getMonth() + 1 === m) ? " actual" : "";
    return `<div class="mcard${actual}">
      <div class="mt"><button data-act="ir-mes" data-mes="${m}">${nombre}</button><span>${corto(totalMes(m))}</span></div>
      ${calendario(y, m, true)}
    </div>`;
  }).join("");
  return `
  <div class="card">
    <h2>📅 Mi año ${y}</h2>
    <div class="total" style="margin-top:0"><span>Lo que pagas tú en el año</span><span>${soles(totalTu)}</span></div>
    <div class="total suave"><span>Total de todo (incluye lo de otras personas)</span><span>${soles(totalTodo)}</span></div>
    <div class="total suave"><span>Ahorrado hasta ahora</span><span>${soles(acum)}</span></div>
    <p class="vacio-msg" style="margin:10px 0 0">Toca el nombre de un mes para ir a su sección. Los puntitos marcan los días con gastos tuyos.</p>
  </div>
  <div class="anio-grid">${cards}</div>`;
}

function vistaAhorro(){
  const {filas, acum} = ahorroDatos();
  const meta = S.meta || {nombre: "Mi meta de ahorro", monto: 0};
  const montoMeta = num(meta.monto);
  const pct = montoMeta > 0 ? Math.max(0, acum) / montoMeta * 100 : 0;
  const falta = Math.max(0, montoMeta - Math.max(0, acum));
  const tabla = filas.map(f => `<tr>
      <td>${MESES[f.m - 1]}</td>
      <td class="num">${soles(f.ing)}</td>
      <td class="num">${soles(f.gas)}</td>
      <td class="num ${f.sobra >= 0 ? "baja" : "sube"}">${soles(f.sobra)}</td>
      <td class="num"><b>${soles(f.acum)}</b></td>
    </tr>`).join("");
  return `
  <div class="card">
    <h2>💰 Mi ahorro ${S.anio}</h2>
    <p class="vacio-msg" style="margin:0 0 10px">Anota tus ingresos en cada mes (sección 🌸 Mes). Lo que te sobra = ingresos − lo que pagas tú.</p>
    <div class="total suave" style="margin-top:0"><span>Ahorrado hasta ahora</span><span>${soles(acum)}</span></div>
    ${montoMeta > 0 ? `
      <div style="margin-top:14px"><b>🎯 ${esc(meta.nombre || "Mi meta")}</b> · ${soles(montoMeta)}</div>
      <div class="meta-barra"><div style="width:${Math.min(100, Math.max(0, pct)).toFixed(1)}%"></div></div>
      <div class="vacio-msg" style="padding:0">${pct >= 100 ? "¡Lo lograste! 🎉" : `Llevas ${pct.toFixed(0)}% · te faltan ${soles(falta)}`}</div>`
      : `<div class="vacio-msg" style="margin-top:12px">Aún no tienes una meta. Ponle una abajo 🎯</div>`}
  </div>
  <div class="grid2">
    <div class="card">
      <h2>📊 Mes a mes</h2>
      ${filas.length ? `<table>
        <thead><tr><th>Mes</th><th class="num">Ingresos</th><th class="num">Tus gastos</th><th class="num">Sobra</th><th class="num">Acumulado</th></tr></thead>
        <tbody>${tabla}</tbody>
      </table>` : `<div class="vacio-msg">Aún no hay meses para mostrar.</div>`}
    </div>
    <div class="card">
      <h2>🎯 Mi meta de ahorro</h2>
      <form class="form" data-form="meta">
        <div><label>¿Para qué?</label><input name="nombre" value="${esc(meta.nombre || "")}" placeholder="ej: viaje, laptop"></div>
        <div><label>Monto meta (S/)</label><input name="monto" type="number" step="0.01" min="0" value="${montoMeta || ""}" required></div>
        <button class="btn" type="submit">Guardar meta 🎯</button>
      </form>
    </div>
  </div>`;
}

function vistaTodos(){
  const catOpts = `<option value="">Todas las categorías</option>` +
    catsTodas().map(c => `<option ${ui.fcat === c ? "selected" : ""}>${esc(c)}</option>`).join("");
  const quienOpts = `<option value="">Todos</option>` +
    ["Yo", ...S.personas].map(p => `<option ${ui.fquien === p ? "selected" : ""}>${esc(p)}</option>`).join("");
  return `
  <div class="card">
    <h2>📋 Todos mis gastos</h2>
    <div class="form" style="margin-bottom:12px">
      <div style="flex:2 1 200px"><label>Buscar</label><input id="busqueda" placeholder="🔎 Nombre del gasto…" value="${esc(ui.busqueda)}"></div>
      <div><label>Categoría</label><select data-chg="fcat">${catOpts}</select></div>
      <div><label>Quién pagó</label><select data-chg="fquien">${quienOpts}</select></div>
    </div>
    <div id="lista-todos">${listaTodos()}</div>
  </div>`;
}
function listaTodos(){
  const q = norm(ui.busqueda);
  const lista = S.gastos
    .filter(g => !q || norm(g.desc).includes(q))
    .filter(g => !ui.fcat || catDe(g) === ui.fcat)
    .filter(g => !ui.fquien || (g.quien || "Yo") === ui.fquien)
    .sort((a, b) => b.fecha.localeCompare(a.fecha))
    .slice(0, 300);

function vistaComp(){
  const estilo = getComputedStyle(document.documentElement);
  const colorFuerte = estilo.getPropertyValue("--rosa-fuerte").trim() || "#ff7ab8";
  const colorTexto = estilo.getPropertyValue("--rosa-texto").trim() || "#c2578a";
  const colorBorde = estilo.getPropertyValue("--card-borde").trim() || "#ffe3f0";
  const colorTxt = estilo.getPropertyValue("--texto").trim() || "#4a2a3c";
  const vals = Array.from({length: 12}, (_, i) => totalMes(i + 1));
  const max = Math.max(1, ...vals);
  const W = 900, H = 340, padL = 50, padR = 30, padT = 40, padB = 50;
  const dx = (W - padL - padR) / 11;
  const pts = vals.map((v, i) => ({x: padL + i * dx, y: padT + (H - padT - padB) * (1 - v / max)}));
  let path = `M ${pts[0].x} ${pts[0].y}`;
  for(let i = 1; i < pts.length; i++){
    const p0 = pts[i - 1], p1 = pts[i];
    const cx = (p0.x + p1.x) / 2;
    path += ` C ${cx} ${p0.y}, ${cx} ${p1.y}, ${p1.x} ${p1.y}`;
  }
  const area = `${path} L ${pts[11].x} ${H - padB} L ${pts[0].x} ${H - padB} Z`;
  const grid = [0, 0.25, 0.5, 0.75, 1].map(t => {
    const y = padT + (H - padT - padB) * (1 - t);
    return `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="${colorBorde}" stroke-width="1"/>
            <text x="${padL - 8}" y="${y + 4}" font-size="11" text-anchor="end" fill="#9b7a8c">${corto(max * t)}</text>`;
  }).join("");
  const etiquetas = pts.map((p, i) => `<text x="${p.x}" y="${H - padB + 20}" font-size="12" text-anchor="middle" fill="${colorTexto}">${MESES_CORTO[i]}</text>`).join("");
  const valores = pts.map((p, i) => vals[i] > 0
    ? `<text x="${p.x}" y="${p.y - 12}" font-size="11" text-anchor="middle" fill="${colorTxt}" font-weight="bold">${corto(vals[i])}</text>` : "").join("");
  const puntos = pts.map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="7" fill="${colorFuerte}" stroke="#fff" stroke-width="3"><title>${MESES[i]}: ${soles(vals[i])}</title></circle>`).join("");

  const mayor = vals.indexOf(Math.max(...vals));
  return `
  <div class="card">
    <h2>🌊 Lo que pagas tú cada mes (${S.anio})</h2>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gasto por mes">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${colorFuerte}" stop-opacity=".45"/>
          <stop offset="100%" stop-color="${colorFuerte}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${grid}
      <path d="${area}" fill="url(#g)"/>
      <path d="${path}" fill="none" stroke="${colorFuerte}" stroke-width="5" stroke-linecap="round"/>
      ${valores}${puntos}${etiquetas}
    </svg>
  </div>
  ${tortaHTML(ui.mes)}
  <div class="card">
    <h2>🏆 Mes con más gasto</h2>
    <div class="total" style="margin-top:0"><span>${MESES[mayor]}</span><span>${soles(vals[mayor])}</span></div>
    <p class="vacio-msg" style="margin:10px 0 0">Total tuyo del año: <b>${soles(vals.reduce((a, b) => a + b, 0))}</b>. Lo que pagan otros no se suma aquí.</p>
  </div>`;
}

function tortaHTML(m){
  const t = totalesCatsMio(m);
  const items = Object.entries(t).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const total = items.reduce((a, [, v]) => a + v, 0);
  if(!total) return `<div class="card"><h2>🍩 ¿En qué gastas más?</h2><div class="vacio-msg">Aún no hay gastos tuyos este mes.</div></div>`;
  const colores = items.map((_, i) => `hsl(${(i * 47 + 330) % 360} 80% 62%)`);
  const R = 90, rin = 55, C = 110;
  const pt = (a, rad) => [C + rad * Math.cos(a), C + rad * Math.sin(a)];
  let a0 = -Math.PI / 2, dibujo = "";
  if(items.length === 1){
    dibujo = `<circle cx="${C}" cy="${C}" r="${(R + rin) / 2}" fill="none" stroke="${colores[0]}" stroke-width="${R - rin}"/>`;
  } else {
    items.forEach(([c, v], i) => {
      const a1 = a0 + v / total * 2 * Math.PI;
      const grande = (a1 - a0) > Math.PI ? 1 : 0;
      const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R), [x2, y2] = pt(a1, rin), [x3, y3] = pt(a0, rin);
      dibujo += `<path d="M${x0} ${y0} A${R} ${R} 0 ${grande} 1 ${x1} ${y1} L${x2} ${y2} A${rin} ${rin} 0 ${grande} 0 ${x3} ${y3} Z" fill="${colores[i]}"><title>${esc(c)}: ${soles(v)}</title></path>`;
      a0 = a1;
    });
  }
  const leyenda = items.map(([c, v], i) => `<div class="item" style="margin-bottom:6px">
      <span class="desc"><i style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${colores[i]};margin-right:6px"></i>${esc(c)}</span>
      <span class="monto">${Math.round(v / total * 100)}% · ${soles(v)}</span></div>`).join("");
  return `<div class="card">
    <h2>🍩 ¿En qué gastas más este mes?</h2>
    <div style="display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center">
      <svg viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Torta de categorías">${dibujo}</svg>
      <div style="flex:1 1 220px;min-width:0">${leyenda}</div>
    </div>
  </div>`;
}

function filaComparar(nombre, a, b){
  const diff = b - a;
  const pct = a > 0 ? diff / a * 100 : (b > 0 ? 100 : 0);
  const clase = diff > 0.005 ? "sube" : diff < -0.005 ? "baja" : "";
  const flecha = diff > 0.005 ? "▲" : diff < -0.005 ? "▼" : "=";
  return `<tr><td>${esc(nombre)}</td><td class="num">${soles(a)}</td><td class="num">${soles(b)}</td>
    <td class="num ${clase}">${flecha} ${soles(Math.abs(diff))}</td><td class="num ${clase}">${pct.toFixed(0)}%</td></tr>`;
}
function vistaComparar(){
  const A = ui.compA, B = ui.compB;
  const opts = sel => MESES.map((n, i) => `<option value="${i + 1}" ${i + 1 === sel ? "selected" : ""}>${n}</option>`).join("");
  const ca = totalesCatsMio(A), cb = totalesCatsMio(B);
  const filas = catsTodas().map(c => (ca[c] || cb[c]) ? filaComparar(c, ca[c] || 0, cb[c] || 0) : "").join("");
  return `
  <div class="card">
    <h2>⚖️ Comparar dos meses</h2>
    <div class="form" style="margin-bottom:12px">
      <div><label>Primer mes</label><select data-chg="compA">${opts(A)}</select></div>
      <div><label>Segundo mes</label><select data-chg="compB">${opts(B)}</select></div>
    </div>
    <table>
      <thead><tr><th>Categoría</th><th class="num">${MESES[A - 1]}</th><th class="num">${MESES[B - 1]}</th><th class="num">Diferencia</th><th class="num">%</th></tr></thead>
      <tbody>
        ${filas || `<tr><td colspan="5" class="vacio-msg">No hay gastos en esos meses.</td></tr>`}
        ${filaComparar("Fijos", fijosMio(A), fijosMio(B))}
        ${filaComparar("TOTAL", totalMes(A), totalMes(B))}
      </tbody>
    </table>
    <p class="vacio-msg" style="margin:10px 0 0">▲ significa que gastaste más en el segundo mes; ▼ que gastaste menos.</p>
  </div>`;
}

function vistaCuentas(){
  const m = ui.mes;
  const itemsCasa = [
    ...gastosMes(m).filter(esOtro).map(g => ({id: g.id, tipo: "gasto", desc: g.desc, monto: g.monto, quien: g.quien, sub: fechaLarga(g.fecha)})),
    ...subsActivos(m).filter(s => esOtro(s) && !esComp(s)).map(s => ({id: s.id, tipo: "sub", desc: s.nombre, monto: s.monto, quien: s.quien, sub: "mensual"}))
  ];
  const total = sumar(itemsCasa);
  const personas = ["Yo", ...S.personas];
  const pct = porcentajes(personas);
  const pagado = {};
  personas.forEach(p => pagado[p] = 0);
  itemsCasa.forEach(x => { if(pagado.hasOwnProperty(x.quien)) pagado[x.quien] += num(x.monto); });
  const filasPersonas = personas.map(p => {
    const cuotaP = total * pct[p] / 100;
    const bal = pagado[p] - cuotaP;
    const txt = bal > 0.005 ? `le deben <b>${soles(bal)}</b>` : bal < -0.005 ? `debe <b style="color:#e0245e">${soles(-bal)}</b>` : `al día ✨`;
    return `<div class="item"><span class="desc">${esc(p)}<br><small style="color:var(--gris)">${pct[p].toFixed(1).replace(".0", "")}% · le toca ${soles(cuotaP)}</small></span>
      <span>pagó ${soles(pagado[p])}</span><span>${txt}</span></div>`;
  }).join("");
  const formPct = `<form class="form" data-form="reparto" style="margin-top:12px">
      ${personas.map(p => `<div style="flex:1 1 90px"><label>${esc(p)} (%)</label><input name="pct_${esc(p)}" type="number" step="0.1" min="0" max="100" value="${+pct[p].toFixed(2)}"></div>`).join("")}
      <button class="btn" type="submit">Guardar % 💾</button>
      <button class="btn suave" type="button" data-act="reparto-iguales">Partes iguales</button>
    </form>
    <p class="vacio-msg" style="margin:6px 0 0">Los porcentajes deben sumar 100%.</p>`;
  const comp = subsActivos(m).filter(esComp);
  const compHTML = comp.map(s => filaConjunto(s, m)).join("") || `<div class="vacio-msg">No hay pagos en conjunto. Al crear un gasto fijo, marca "Pago en conjunto" y elige entre quiénes se divide.</div>`;
  const listaCasa = itemsCasa.length ? itemsCasa.map(x => `<div class="item">
      <label class="seleccion"><input type="checkbox" data-chg="sel" data-id="${x.id}" ${ui.sel[x.id] ? "checked" : ""}></label>
      <span class="desc">${esc(x.desc)}<br><small style="color:var(--gris)">${esc(x.sub)}</small></span>
      <span class="monto">${soles(x.monto)}</span>
      <select data-chg="quien" data-tipo="${x.tipo}" data-id="${x.id}">${opcionesQuien(x.quien)}</select>
    </div>`).join("")
    : `<div class="vacio-msg">Este mes no hay gastos pagados por otras personas.</div>`;
  const seleccionados = itemsCasa.filter(x => ui.sel[x.id]);
  const totalSel = sumar(seleccionados);

  const personasHTML = S.personas.map(p => `<span class="chip on" style="cursor:default">${esc(p)}
      <button data-act="del-persona" data-p="${esc(p)}" style="background:none;border:none;color:var(--on);cursor:pointer;font-weight:bold">✕</button></span>`).join("")
    || `<span class="vacio-msg">Aún no agregas personas.</span>`;

  return `
  <div class="monthbar">
    <button class="btn suave" data-act="mes-prev">◀</button>
    <div class="titulo">Cuentas de ${MESES[m - 1]}</div>
    <button class="btn suave" data-act="mes-next">▶</button>
  </div>
  <div class="grid2">
    <div>
      <div class="card">
        <h2>👥 Personas de la casa</h2>
        <div class="chips" style="margin-bottom:12px">${personasHTML}</div>
        <form class="form" data-form="persona">
          <div><label>Nombre</label><input name="nombre" required placeholder="ej: Mamá"></div>
          <button class="btn" type="submit">Agregar 👥</button>
        </form>
        <p class="vacio-msg" style="margin:10px 0 0">Tú (Yo) cuentas como una persona más. Al anotar un gasto o fijo eliges quién lo pagó.</p>
      </div>
      <div class="card">
        <h2>🏠 Pagados por otras personas</h2>
        <p class="vacio-msg" style="margin:0 0 8px">Marca con la casilla los gastos que quieras sumar.</p>
        ${listaCasa}
        <div class="total"><span>Total de casa</span><span>${soles(total)}</span></div>
        ${seleccionados.length ? `<div class="total suave"><span>Seleccionados (${seleccionados.length})</span><span>${soles(totalSel)}</span></div>` : ""}
      </div>
    </div>
    <div>
      <div class="card">
        <h2>🧾 Cuentas del mes</h2>
        <label class="interruptor"><input type="checkbox" data-chg="reparto-activo" ${S.reparto.activo ? "checked" : ""}> Dividir los gastos de casa entre todos</label>
        ${S.reparto.activo ? `
          <p class="vacio-msg" style="margin:8px 0 10px">Cada persona paga según su porcentaje del total de casa (${soles(total)}).</p>
          ${filasPersonas}
          ${formPct}` : `<p class="vacio-msg" style="margin:8px 0 0">La división está apagada. Actívala si quieres ver cuánto le toca a cada uno.</p>`}

      <div class="card">
        <h2>🤝 Pagos en conjunto</h2>

/* ===================== Cobros y notificaciones ===================== */
/* Pagos de fijos que vienen en los próximos "dias" días (incluye hoy) */
function proximosPagos(dias){
  const out = [];
  for(let k = 0; k <= dias; k++){
    const f = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + k);
    if(f.getFullYear() !== S.anio) continue;
    const m = f.getMonth() + 1, d = f.getDate();
    S.subs.filter(s => s.nombre && Number(s.dia) === d && !(s.pausas || []).includes(m))
      .forEach(s => out.push({id: s.id, fecha: iso(f.getFullYear(), m, d), k, nombre: s.nombre, monto: s.monto, quien: s.quien}));
  }
  return out;
}
function textoCuando(k){ return k === 0 ? "hoy" : k === 1 ? "mañana" : `en ${k} días`; }
function notificarProximos(){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  let visto = {};
  try{ visto = JSON.parse(localStorage.getItem("mg_avisos") || "{}"); }catch(e){}
  proximosPagos(3).forEach(p => {
    const clave = `${hoyIso()}-${p.id}-${p.fecha}`;
    if(visto[clave]) return;
    new Notification("🎀 Cobro próximo", {body: `${p.nombre} (${soles(p.monto)}) ${textoCuando(p.k)}`});
    visto[clave] = true;
  });
  try{ localStorage.setItem("mg_avisos", JSON.stringify(visto)); }catch(e){}
}
function abrirPagos(){
  document.getElementById("modal-titulo").textContent = "🔔 Tus próximos pagos";
  const lista = proximosPagos(30);
  document.getElementById("modal-body").innerHTML = lista.length
    ? lista.map(p => `<div class="item"><span class="desc">${esc(p.nombre)}<br><small style="color:var(--gris)">${esc(fechaLarga(p.fecha))} · ${textoCuando(p.k)} · pagó ${esc(p.quien)}</small></span><span class="monto">${soles(p.monto)}</span></div>`).join("")
    : `<div class="vacio-msg">No hay cobros de fijos en los próximos 30 días ✨</div>`;
  document.getElementById("overlay").classList.add("abierto");
}

/* ===================== Exportar a Excel (.xlsx real, con formato) ===================== */
const XL = (() => {
  const CRC = (() => { const t = []; for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = b => { let c = 0xFFFFFFFF; for(let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  /* ZIP sin compresión: suficiente para un .xlsx */
  function zip(archivos){
    const enc = new TextEncoder(), partes = [], central = [];
    let off = 0;
    archivos.forEach(([nombre, texto]) => {
      const n = enc.encode(nombre), d = enc.encode(texto), crc = crc32(d);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
      h.setUint32(14, crc, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, n.length, true);
      partes.push(new Uint8Array(h.buffer), n, d);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
      c.setUint32(16, crc, true); c.setUint32(20, d.length, true); c.setUint32(24, d.length, true); c.setUint16(28, n.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), n);
      off += 30 + n.length + d.length;
    });
    const tam = central.reduce((a, x) => a + x.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, archivos.length, true); e.setUint16(10, archivos.length, true);
    e.setUint32(12, tam, true); e.setUint32(16, off, true);
    return new Blob([...partes, ...central, new Uint8Array(e.buffer)], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  }
  const x = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
  const col = i => { let s = ""; i++; while(i){ const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; };
  /* estilos: 1 título, 2 subtítulo, 3 encabezado, 4 texto, 5 fecha, 6 soles, 7 total (texto), 8 total (soles), 9 soles con negativo en rojo, 10 número centrado, 11 texto gris */
  const ESTILOS = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="3"><numFmt numFmtId="164" formatCode="&quot;S/ &quot;#,##0.00"/><numFmt numFmtId="165" formatCode="dd/mm/yyyy"/><numFmt numFmtId="166" formatCode="&quot;S/ &quot;#,##0.00;[Red]-&quot;S/ &quot;#,##0.00"/></numFmts>
<fonts count="6"><font><sz val="11"/><color rgb="FF4A1038"/><name val="Calibri"/></font><font><b/><sz val="18"/><color rgb="FFE6007E"/><name val="Calibri"/></font><font><i/><sz val="10"/><color rgb="FF9A5A80"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FF4A1038"/><name val="Calibri"/></font><font><sz val="11"/><color rgb="FF9A5A80"/><name val="Calibri"/></font></fonts>
<fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE6007E"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFFE0F3"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFFF5FB"/></patternFill></fill></fills>
<borders count="2"><border/><border><left style="thin"><color rgb="FFFFB3DD"/></left><right style="thin"><color rgb="FFFFB3DD"/></right><top style="thin"><color rgb="FFFFB3DD"/></top><bottom style="thin"><color rgb="FFFFB3DD"/></bottom></border></borders>
<cellStyleXfs count="1"><xf/></cellStyleXfs>
<cellXfs count="12">
<xf/>
<xf fontId="1" applyFont="1"/>
<xf fontId="2" applyFont="1"/>
<xf fontId="3" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>
<xf borderId="1" applyBorder="1"/>
<xf numFmtId="165" borderId="1" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center"/></xf>
<xf numFmtId="164" borderId="1" applyNumberFormat="1" applyBorder="1"/>
<xf fontId="4" fillId="3" borderId="1" applyFont="1" applyFill="1" applyBorder="1"/>
<xf numFmtId="166" fontId="4" fillId="3" borderId="1" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"/>
<xf numFmtId="166" borderId="1" applyNumberFormat="1" applyBorder="1"/>
<xf borderId="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center"/></xf>
<xf fontId="5" borderId="1" applyFont="1" applyBorder="1"/>
</cellXfs>
</styleSheet>`;
  /* filas: arrays de celdas {v, s, f}; null = vacía */
  function hoja(filas, o = {}){
    const datos = filas.map((fila, r) => `<row r="${r + 1}"${o.altos && o.altos[r] ? ` ht="${o.altos[r]}" customHeight="1"` : ""}>` + fila.map((c, i) => {
      if(!c) return "";
      const ref = col(i) + (r + 1), s = c.s ? ` s="${c.s}"` : "";
      if(c.f) return `<c r="${ref}"${s}><f>${x(c.f)}</f>${typeof c.v === "number" ? `<v>${c.v}</v>` : ""}</c>`;
      if(typeof c.v === "number") return `<c r="${ref}"${s}><v>${c.v}</v></c>`;
      if(c.v === undefined || c.v === "") return `<c r="${ref}"${s}/>`;
      return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${x(c.v)}</t></is></c>`;
    }).join("") + `</row>`).join("");
    const panel = o.fijar ? `<pane ySplit="${o.fijar}" topLeftCell="A${o.fijar + 1}" activePane="bottomLeft" state="frozen"/>` : "";
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheetViews><sheetView workbookViewId="0" showGridLines="0">${panel}</sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="16"/>
<cols>${(o.anchos || []).map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("")}</cols>
<sheetData>${datos}</sheetData>
${o.filtro ? `<autoFilter ref="${o.filtro}"/>` : ""}
${o.unir && o.unir.length ? `<mergeCells count="${o.unir.length}">${o.unir.map(m => `<mergeCell ref="${m}"/>`).join("")}</mergeCells>` : ""}
<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>
<pageSetup orientation="landscape" fitToHeight="0"/>
</worksheet>`;
  }
  function libro(hojas){
    const nombres = hojas.map(h => h.nombre.replace(/[\\\/\?\*\[\]:]/g, "").slice(0, 31));
    const filtros = hojas.map((h, i) => h.opts.filtro ? `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${x(nombres[i])}'!$${h.opts.filtro.replace(":", ":$").replace(/([A-Z]+)(\d+)/g, "$1$$$2")}</definedName>` : "").join("");
    const archivos = [
      ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${hojas.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
      ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
      ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${nombres.map((n, i) => `<sheet name="${x(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets>${filtros ? `<definedNames>${filtros}</definedNames>` : ""}<calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`],
      ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${hojas.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId${hojas.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
      ["xl/styles.xml", ESTILOS],
      ...hojas.map((h, i) => [`xl/worksheets/sheet${i + 1}.xml`, hoja(h.filas, h.opts)])
    ];
    return zip(archivos);
  }
  const fechaSerial = f => { const [y, m, d] = f.split("-").map(Number); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000); };
  return {libro, col, fechaSerial};
})();

function exportarExcel(mes){
  const meses = mes ? [mes] : Array.from({length: 12}, (_, i) => i + 1);
  const periodo = mes ? `${MESES[mes - 1]} ${S.anio}` : `Año ${S.anio}`;
  const generado = `Descargado el ${fechaLarga(hoyIso())}`;
  const T = (v, s = 4) => ({v, s}), M = (v, s = 6) => ({v: Math.round(num(v) * 100) / 100, s});
  const SUMA = (c, r1, r2, v) => ({f: `SUM(${c}${r1}:${c}${r2})`, v: Math.round(v * 100) / 100, s: 8});
  const titulo = (txt, n) => [[{v: txt, s: 1}, ...Array(n - 1).fill(null)], [{v: `${periodo} · ${generado}`, s: 2}], []];
  const C = XL.col;

  /* 1) Resumen por mes */
  const r1 = titulo("🎀 Mis gastos · Resumen", 7);
  r1.push(["Mes", "Ingresos", "Gastos del día a día (tuyos)", "Fijos (tu parte)", "Total que pagaste", "Te sobra", "Pagado por otras personas"].map(h => T(h, 3)));
  const ini1 = r1.length + 1;
  const tot1 = [0, 0, 0, 0, 0, 0];
  meses.forEach(m => {
    const fila = [totalIngresosMes(m), varMio(m), fijosMio(m), totalMes(m), totalIngresosMes(m) - totalMes(m), casaMes(m)];
    fila.forEach((v, i) => tot1[i] += v);
    const r = r1.length + 1;
    r1.push([T(MESES[m - 1]), M(fila[0]), M(fila[1]), M(fila[2]), {f: `C${r}+D${r}`, v: fila[3], s: 6}, {f: `B${r}-E${r}`, v: fila[4], s: 9}, M(fila[5])]);
  });
  const fin1 = r1.length;
  if(meses.length > 1) r1.push([T("Total", 7), ...tot1.map((v, i) => SUMA(C(i + 1), ini1, fin1, v))]);

  /* 2) Gastos del día a día */
  const gs = meses.flatMap(m => gastosMes(m)).sort((a, b) => a.fecha.localeCompare(b.fecha) || String(a.desc).localeCompare(String(b.desc)));
  const r2 = titulo("🧾 Gastos del día a día", 6);
  r2.push(["Fecha", "Mes", "Descripción", "Categoría", "Pagado por", "Monto"].map(h => T(h, 3)));
  const cab2 = r2.length, ini2 = cab2 + 1;
  gs.forEach(g => {
    const [, mm] = g.fecha.split("-").map(Number);
    r2.push([{v: XL.fechaSerial(g.fecha), s: 5}, T(MESES[mm - 1]), T(g.desc + (g.rutina ? " (se repite)" : "")), T(catDe(g)), T(esOtro(g) ? g.quien : "Yo"), M(g.monto)]);
  });
  if(!gs.length) r2.push([T("No hay gastos en este periodo.", 11)]);
  const fin2 = r2.length;
  const filtro2 = gs.length ? `A${cab2}:F${fin2}` : null;
  if(gs.length) r2.push([T("Total", 7), T("", 7), T("", 7), T("", 7), T("", 7), SUMA("F", ini2, fin2, sumar(gs))]);

  /* 3) Fijos: una fila por cada fijo y una columna por mes */
  const subs = S.subs.filter(s => s.nombre);
  const nCols3 = 5 + meses.length + 1;
  const r3 = titulo("🔁 Gastos fijos", nCols3);
  r3.push(["Fijo", "Categoría", "Día de cobro", "Pagado por", "Tu parte al mes", ...meses.map(m => MESES[m - 1].slice(0, 3)), "Total"].map(h => T(h, 3)));
  const ini3 = r3.length + 1;
  subs.forEach(s => {
    const r = r3.length + 1;
    const quien = esComp(s) ? "Entre " + s.entre.join(", ") : (esOtro(s) ? s.quien : "Yo");
    const celdas = meses.map(m => (s.pausas || []).includes(m) ? T("pausado", 11) : M(s.monto));
    const tot = meses.reduce((a, m) => a + ((s.pausas || []).includes(m) ? 0 : num(s.monto)), 0);
    r3.push([T(s.nombre), T(catAuto(s.nombre)), s.dia ? {v: Number(s.dia), s: 10} : T("—", 10), T(quien), M(subMio(s)), ...celdas,
      {f: `SUM(${C(5)}${r}:${C(4 + meses.length)}${r})`, v: tot, s: 6}]);
  });
  if(!subs.length) r3.push([T("No tienes gastos fijos.", 11)]);
  const fin3 = r3.length;
  if(subs.length){
    r3.push([T("Total", 7), T("", 7), T("", 7), T("", 7), SUMA("E", ini3, fin3, subs.reduce((a, s) => a + subMio(s), 0)),
      ...meses.map((m, i) => SUMA(C(5 + i), ini3, fin3, sumar(subsActivos(m)))), SUMA(C(5 + meses.length), ini3, fin3, meses.reduce((a, m) => a + sumar(subsActivos(m)), 0))]);
  }

  /* 4) Por categoría (lo tuyo, día a día) */
  const catsT = meses.map(m => totalesCatsMio(m));
  const nombresCat = catsTodas().filter(c => catsT.some(t => t[c]));
  Object.keys(Object.assign({}, ...catsT)).forEach(c => { if(!nombresCat.includes(c) && catsT.some(t => t[c])) nombresCat.push(c); });
  const r4 = titulo("🏷️ Tus gastos por categoría", meses.length + 2);
  r4.push(["Categoría", ...meses.map(m => MESES[m - 1].slice(0, 3)), "Total"].map(h => T(h, 3)));
  const ini4 = r4.length + 1;
  nombresCat.sort((a, b) => catsT.reduce((s, t) => s + (t[b] || 0), 0) - catsT.reduce((s, t) => s + (t[a] || 0), 0)).forEach(c => {
    const r = r4.length + 1;
    r4.push([T(c), ...catsT.map(t => M(t[c] || 0)), {f: `SUM(B${r}:${C(meses.length)}${r})`, v: catsT.reduce((s, t) => s + (t[c] || 0), 0), s: 6}]);
  });
  if(!nombresCat.length) r4.push([T("Sin gastos tuyos en este periodo.", 11)]);
  const fin4 = r4.length;
  if(nombresCat.length) r4.push([T("Total", 7), ...meses.map((m, i) => SUMA(C(1 + i), ini4, fin4, varMio(m))), SUMA(C(1 + meses.length), ini4, fin4, meses.reduce((a, m) => a + varMio(m), 0))]);

  /* 5) Ingresos */
  const ings = meses.flatMap(m => [
    ...ingresosMes(m).map(i => ({m, fecha: i.fecha, desc: i.desc, monto: i.monto, tipo: "Ingreso"})),
    ...sueldosMes(m).map(s => ({m, fecha: "", desc: s.desc, monto: s.monto, tipo: "Sueldo (cada mes)"}))
  ]);
  const r5 = titulo("💰 Ingresos", 5);
  r5.push(["Mes", "Fecha", "Descripción", "Tipo", "Monto"].map(h => T(h, 3)));
  const ini5 = r5.length + 1;
  ings.forEach(i => r5.push([T(MESES[i.m - 1]), i.fecha ? {v: XL.fechaSerial(i.fecha), s: 5} : T("—", 10), T(i.desc), T(i.tipo), M(i.monto)]));
  if(!ings.length) r5.push([T("No hay ingresos en este periodo.", 11)]);
  const fin5 = r5.length;
  if(ings.length) r5.push([T("Total", 7), T("", 7), T("", 7), T("", 7), SUMA("E", ini5, fin5, sumar(ings))]);

/* Scene: sonido de abrir la tapita de un celular flip (clic plástico + bip doble) */
function clickTapita(ac){
  const t = ac.currentTime;
  const largo = Math.ceil(ac.sampleRate * 0.03), buf = ac.createBuffer(1, largo, ac.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < largo; i++) d[i] = Math.random() * 2 - 1;
  const n = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
  n.buffer = buf; f.type = "bandpass"; f.frequency.value = 3500; f.Q.value = 3;
  gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.35, t + 0.001); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.025);
  n.connect(f); f.connect(gn); gn.connect(ac.destination); n.start(t);
  [[1046.5, 0.05, 0.06], [1568, 0.1, 0.08]].forEach(([fr, ini, dur]) => {
    const o = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain(), t0 = t + ini;
    o.type = "square"; o.frequency.value = fr; lp.type = "lowpass"; lp.frequency.value = 3500;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.04, t0 + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(lp); lp.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  });
}
function tocarClick(){
  if(!AUDIO.sonidos) return;
  const ac = contextoAudio(); if(!ac) return;
  if(temaVisible() === "scene"){ clickTapita(ac); return; }
  if(temaVisible() !== "messenger") return;   // los temas gratis no tienen sonido de botón
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(260, t);
  o.frequency.exponentialRampToValueAtTime(640, t + 0.08);   // sube como burbuja
  o.frequency.exponentialRampToValueAtTime(380, t + 0.2);    // rebota (boing)
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.14, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0008, t + 0.22);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.24);
}
/* Música de fondo por tema (sintetizada en el navegador) */
let musicaTema = null, musicaPaso = 0;
function tono(freq, tipo, t, dur, vol, ataque, filtroHz){
  const ac = contextoAudio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = tipo; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + ataque);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let nodo = o;
  if(filtroHz){ const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = filtroHz; o.connect(f); nodo = f; }
  nodo.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
}
/* Messenger 2000s: acuático, relajante (acordes suaves + burbujas) */
const ACORDES_AQUA = [[261.63, 329.63, 392, 493.88], [220, 261.63, 329.63, 392], [174.61, 220, 261.63, 329.63], [196, 246.94, 293.66, 392]];
function musicaAcuatica(){
  const ac = contextoAudio(); if(!ac) return;
  const t = ac.currentTime;
  if(musicaPaso % 10 === 0){                       // cada ~2.5 s un acorde
    const acorde = ACORDES_AQUA[(musicaPaso / 10) % ACORDES_AQUA.length];
    acorde.forEach(f => tono(f, "sine", t, 3.2, 0.018, 0.9));
  }
  musicaPaso++;
}
/* Scene: emo de los 2000 (arpegios menores con sierra filtrada y bombo) */
const PROG_EMO = [[110, [220, 261.63, 329.63]], [87.31, [174.61, 220, 261.63]], [130.81, [261.63, 329.63, 392]], [98, [196, 246.94, 293.66]]];
function musicaEmo(){
  const ac = contextoAudio(); if(!ac) return;
  const t = ac.currentTime;
  const grupo = PROG_EMO[Math.floor(musicaPaso / 16) % PROG_EMO.length];
  const notas = grupo[1];
  const paso = musicaPaso % 16;
  if(paso % 2 === 0){                               // corcheas del arpegio
    const f = notas[(paso / 2) % notas.length];
    tono(f, "sawtooth", t, 0.22, 0.02, 0.005, 1400);
  }
  if(paso % 8 === 0){                               // bombo
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
    g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.22);
  }
  if(paso % 8 === 4) tono(grupo[0] * 4, "square", t, 0.06, 0.012, 0.002, 2500); // golpe agudo
  musicaPaso++;
}
