/* ===== Autocompletado de descripción: ↑ ↓ para moverte, Enter para elegir ===== */
function sugerenciasPara(q){
  const n = norm(q);
  if(!n) return [];
  const vistos = new Map();
  [...S.gastos].sort((a, b) => b.fecha.localeCompare(a.fecha)).forEach(g => {
    const k = norm(g.desc); if(!vistos.has(k)) vistos.set(k, g.desc);
  });
  S.subs.forEach(s => { if(s.nombre){ const k = norm(s.nombre); if(!vistos.has(k)) vistos.set(k, s.nombre); } });
  return [...vistos.entries()].filter(([k]) => k.includes(n) && k !== n).slice(0, 6).map(([, d]) => d);
}
function pintarSugs(box){
  box.innerHTML = ui.sugs.map((d, i) =>
    `<button type="button" class="sug ${i === ui.sugIdx ? "on" : ""}" data-act="elegir-sug" data-i="${i}">${esc(d)}</button>`).join("");
}
function mostrarSugs(input){
  const box = input.closest("form").querySelector(".sugs");
  ui.sugs = sugerenciasPara(input.value);
  ui.sugIdx = 0;
  pintarSugs(box);
}
function ocultarSugs(){
  document.querySelectorAll(".sugs").forEach(b => b.innerHTML = "");
  ui.sugs = []; ui.sugIdx = -1;
}
function elegirSug(form, texto){
  form.desc.value = texto;
  // si ya anotaste ese gasto antes, copia su monto y categoría
  const previo = S.gastos.filter(g => norm(g.desc) === norm(texto))
    .sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
  if(previo){
    form.monto.value = num(previo.monto);
    if(previo.cat) form.cat.value = previo.cat;
  }
  ocultarSugs();
  actualizarHint();
  form.desc.focus();
}
appEl.addEventListener("keydown", e => {
  const t = e.target;
  if(!(t.name === "desc" && t.closest('form[data-form="gasto"]') && ui.sugs && ui.sugs.length)) return;
  const box = t.closest("form").querySelector(".sugs");
  if(e.key === "ArrowDown"){ e.preventDefault(); ui.sugIdx = (ui.sugIdx + 1) % ui.sugs.length; pintarSugs(box); }
  else if(e.key === "ArrowUp"){ e.preventDefault(); ui.sugIdx = (ui.sugIdx - 1 + ui.sugs.length) % ui.sugs.length; pintarSugs(box); }
  else if(e.key === "Enter" && ui.sugIdx >= 0){ e.preventDefault(); elegirSug(t.closest("form"), ui.sugs[ui.sugIdx]); }
  else if(e.key === "Escape"){ ocultarSugs(); }
});
appEl.addEventListener("focusout", e => {
  if(e.target.name === "desc") setTimeout(ocultarSugs, 150);
});

appEl.addEventListener("submit", e => {
  const form = e.target;
  e.preventDefault();
  ui.noRestaurar = true;   // al guardar, el formulario sí debe quedar limpio
  const tipo = form.dataset.form;
  const v = Object.fromEntries(new FormData(form).entries());
  const entre = new FormData(form).getAll("entre");
  const quien = v.quien || "Yo";

  if(tipo === "gasto"){
    const n = Math.max(1, Math.min(36, parseInt(v.cuotas, 10) || 1));
    const monto = num(v.monto);
    const cat = v.cat || "";
    const base = v.desc.trim();
    for(let k = 0; k < n; k++){
      S.gastos.push({
        id: uid(), fecha: addMeses(v.fecha, k),
        desc: n > 1 ? `${base} (cuota ${k + 1}/${n})` : base,
        monto, cat, quien
      });
    }
    ui.dia = v.fecha;
    const [y, m] = v.fecha.split("-").map(Number);
    if(y === S.anio) ui.mes = m;
    guardar(); render(); toast(n > 1 ? `Listo: ${n} cuotas guardadas 🎀` : "Gasto guardado 🎀");
  }
  if(tipo === "editgasto"){
    const g = S.gastos.find(x => x.id === form.dataset.id);
    if(g){
      g.fecha = v.fecha; g.desc = v.desc.trim(); g.monto = num(v.monto);
      g.cat = v.cat || ""; g.quien = quien;
      ui.editGasto = null;
      guardar(); render(); toast("Gasto actualizado ✏️");
    }
  }
  const conj = entre.length >= 2 ? entre : [];
  const quienSub = conj.length ? (conj.includes("Yo") ? "Yo" : conj[0]) : quien;
  if(tipo === "sub"){
    S.subs.push({id: uid(), nombre: v.nombre.trim(), monto: num(v.monto), dia: v.dia || "", pausas: [], pagos: {}, quien: quienSub, entre: conj});
    guardar(); render(); toast(conj.length ? "Pago en conjunto agregado 🤝" : "Gasto fijo agregado 🎀");
  }
  if(tipo === "editsub"){
    const s = S.subs.find(x => x.id === form.dataset.id);
    if(s){
      s.nombre = v.nombre.trim(); s.monto = num(v.monto); s.dia = v.dia || ""; s.quien = quienSub; s.entre = conj;
      ui.editSub = null;
      guardar(); render(); toast("Gasto fijo actualizado ✏️");
    }
  }
  if(tipo === "ingreso"){
    const [yy, mm] = v.fecha.split("-").map(Number);
    S.ingresos.push({id: uid(), anio: yy, mes: mm, fecha: v.fecha, desc: v.desc.trim(), monto: num(v.monto)});
    guardar(); render(); toast("Ingreso agregado 💵");
  }
  if(tipo === "reparto"){
    const personas = ["Yo", ...S.personas];
    const pct = {};
    personas.forEach(p => pct[p] = num(v["pct_" + p]));
    const suma = Object.values(pct).reduce((a, x) => a + x, 0);
    if(Math.abs(suma - 100) >= 0.5){ ui.noRestaurar = false; alert(`Los porcentajes suman ${suma.toFixed(1)}%. Deben sumar 100%.`); return; }
    S.reparto.pct = pct;
    guardar(); render(); toast("Porcentajes guardados ⚖️");
  }
  if(tipo === "editingreso"){
    const i = S.ingresos.find(x => x.id === form.dataset.id);
    if(i){
      const [yy, mm] = v.fecha.split("-").map(Number);
      Object.assign(i, {anio: yy, mes: mm, fecha: v.fecha, desc: v.desc.trim(), monto: num(v.monto)});
      ui.editIng = null; guardar(); render(); toast("Ingreso actualizado ✏️");
    }
  }
  if(tipo === "editsueldo"){
    const s = S.sueldos.find(x => x.id === form.dataset.id);
    if(s){
      s.desc = v.desc.trim(); s.monto = num(v.monto);
      ui.editSue = null; guardar(); render(); toast("Sueldo actualizado ✏️");
    }
  }
  if(tipo === "sueldo"){
    S.sueldos.push({id: uid(), desc: v.desc.trim(), monto: num(v.monto), anioDesde: S.anio, mesDesde: Number(form.dataset.mes), hasta: null, pausas: []});
    guardar(); render(); toast("Sueldo agregado: se sumará cada mes 💼");
  }
  if(tipo === "rutina"){
    S.rutinas = S.rutinas || [];
    S.rutinas.push({id: uid(), desc: v.desc.trim(), monto: num(v.monto),
      frec: v.cuando === "diario" ? "diario" : "semanal", dia: v.cuando === "diario" ? null : Number(v.cuando), quien});
    guardar(); render(); toast("Gasto que se repite agregado 🔄");
  }
  if(tipo === "meta"){
    S.meta = {nombre: (v.nombre || "").trim() || "Mi meta de ahorro", monto: num(v.monto)};
    guardar(); render(); toast("Meta guardada 🎯");
  }
  if(tipo === "persona"){
    const n = v.nombre.trim();
    if(!n) return;
    if(S.personas.some(p => norm(p) === norm(n)) || norm(n) === "yo"){ alert("Ese nombre ya existe."); return; }
    S.personas.push(n);
    guardar(); render(); toast("Persona agregada 👥");
  }
  if(tipo === "categoria"){
    const n = v.nombre.trim();
    if(!n) return;
    if(cats().some(c => norm(c) === norm(n))){ alert("Esa categoría ya existe."); return; }
    S.categorias.push(n);
    guardar(); render(); toast("Categoría agregada 🏷️");
  }
  if(tipo === "presupuestos"){
    S.presupuesto = {};
    S.categorias.forEach((c, i) => {
      const val = parseFloat(v[`b_${i}`]);
      if(val > 0) S.presupuesto[c] = val;
    });
    guardar(); render(); toast("Presupuestos guardados 💰");
  }
  if(tipo === "palabra"){
    const k = v.palabra.trim();
    if(k){ S.palabras[k] = v.cat; guardar(); render(); toast("Palabra agregada 🏷️"); }
  }
});

/* ===== Cursores de temas de pago y estela (estrellitas en Scene, burbujas en Messenger) ===== */
document.addEventListener("DOMContentLoaded", function(){
  const parts = [];
  const curS = document.getElementById("cur-scene"), curM = document.getElementById("cur-msn");
  const cv = document.getElementById("estela"), cx = cv.getContext("2d");
  const ROSAS = ["#ff1493", "#ff4fb8", "#e6007e", "#ff85cf"];
  let ux = null, uy = null;
  const modo = () => document.body.classList.contains("scene") ? "scene" : document.body.classList.contains("msn") ? "msn" : null;
  function ajustar(){ cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener("resize", ajustar); ajustar();
  function soltar(x, y, fuerza){
    const m = modo(); if(!m || !EFECTOS.on) return;
    const f = fuerza || 1;
    if(m === "scene") parts.push({tipo: "estrella", x: x + (Math.random() - .5) * 10, y: y + (Math.random() - .5) * 10,
      vx: (Math.random() - .5) * 2.2 * f, vy: (-Math.random() * 1.6 - .3) * f, g: .07,
      r: 3 + Math.random() * 5, rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .25, vida: 1, baja: .018,
      color: ROSAS[Math.floor(Math.random() * ROSAS.length)]});
    else parts.push({tipo: "burbuja", x: x + (Math.random() - .5) * 12, y: y + (Math.random() - .5) * 8,
      vx: (Math.random() - .5) * .8 * f, vy: (-Math.random() * 1.1 - .4) * f, g: -.012,
      r: 2.5 + Math.random() * 5, fase: Math.random() * 6, vida: 1, baja: .014});
    if(parts.length > 180) parts.shift();
  }
  function mover(x, y){
    curS.style.transform = curM.style.transform = "translate(" + x + "px," + y + "px)";
    curS.classList.add("visible"); curM.classList.add("visible");
    const d = ux === null ? 99 : Math.hypot(x - ux, y - uy);
    if(d > 6){ soltar(x, y); if(d > 30) soltar(x, y); ux = x; uy = y; }
  }
  document.addEventListener("pointermove", e => { if(e.pointerType === "mouse") mover(e.clientX, e.clientY); });
  document.addEventListener("mouseleave", () => { curS.classList.remove("visible"); curM.classList.remove("visible"); });
  document.addEventListener("mouseout", e => { if(!e.relatedTarget){ curS.classList.remove("visible"); curM.classList.remove("visible"); } });
  /* En celular/tablet: lluvia de estrellitas o burbujas donde tocas, y estela al deslizar */
  document.addEventListener("pointerdown", e => {
    if(e.pointerType === "mouse") return;
    for(let i = 0; i < 9; i++) soltar(e.clientX, e.clientY, 1.8);
    ux = e.clientX; uy = e.clientY;
  }, {passive: true});
  document.addEventListener("pointermove", e => {
    if(e.pointerType === "mouse") return;
    const d = ux === null ? 99 : Math.hypot(e.clientX - ux, e.clientY - uy);
    if(d > 10){ soltar(e.clientX, e.clientY); ux = e.clientX; uy = e.clientY; }
  }, {passive: true});
  function estrella(x, y, r, rot){
    cx.beginPath();
    for(let i = 0; i < 10; i++){
      const rad = i % 2 ? r * .45 : r, a = rot + i * Math.PI / 5 - Math.PI / 2;
      cx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    cx.closePath();
  }
  let limpio = true;
  (function bucle(){
    requestAnimationFrame(bucle);
    if(!modo() || !EFECTOS.on){ if(!limpio){ parts.length = 0; cx.clearRect(0, 0, cv.width, cv.height); limpio = true; } return; }
    if(!parts.length && limpio) return;
    cx.clearRect(0, 0, cv.width, cv.height); limpio = !parts.length;
    for(let i = parts.length - 1; i >= 0; i--){
      const s = parts[i];
      s.x += s.vx; s.y += s.vy; s.vy += s.g; s.vida -= s.baja;
      if(s.vida <= 0){ parts.splice(i, 1); continue; }
      cx.globalAlpha = Math.min(1, s.vida * 1.4);
      if(s.tipo === "estrella"){
        s.rot += s.vr;
        cx.fillStyle = s.color; cx.shadowColor = "#ff1493"; cx.shadowBlur = 8;
        estrella(s.x, s.y, s.r * (.6 + s.vida * .4), s.rot); cx.fill();
      }else{
        s.fase += .12; const x = s.x + Math.sin(s.fase) * 1.4, r = s.r * (.8 + (1 - s.vida) * .5);
        cx.shadowBlur = 0;
        const gr = cx.createRadialGradient(x - r * .35, y0(s, r), r * .1, x, s.y, r);
        gr.addColorStop(0, "rgba(255,255,255,.9)"); gr.addColorStop(.5, "rgba(143,220,255,.25)"); gr.addColorStop(1, "rgba(42,163,234,.35)");
        cx.fillStyle = gr; cx.beginPath(); cx.arc(x, s.y, r, 0, Math.PI * 2); cx.fill();
        cx.strokeStyle = "rgba(22,115,184,.55)"; cx.lineWidth = 1; cx.stroke();
      }
    }
    cx.globalAlpha = 1; cx.shadowBlur = 0;
  })();
  function y0(s, r){ return s.y - r * .35; }
});

/* ===== Resúmenes en PDF (elige mes, año o rango) ===== */
function resumenDoc(m1, m2){
  let gastos = [], ing = 0, fijos = 0;
  for(let m = m1; m <= m2; m++){
    gastos.push(...gastosMes(m).map(g => ({...g, _m: m})));
    ing += totalIngresosMes(m);
    fijos += fijosMio(m);
  }
  const tuyos = gastos.filter(esMio).sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
  const varTuyos = sumar(tuyos);
  const total = varTuyos + fijos;
  const cats = {};
  tuyos.forEach(g => { cats[g.cat || "Otros"] = (cats[g.cat || "Otros"] || 0) + num(g.monto); });
  const rango = m1 === m2 ? MESES[m1 - 1] + " " + S.anio : MESES[m1 - 1] + " – " + MESES[m2 - 1] + " " + S.anio;
  const filas = tuyos.map(g => `<tr><td>${esc(g.fecha)}</td><td>${esc(g.desc)}</td><td>${esc(g.cat || "")}</td><td style="text-align:right">${soles(g.monto)}</td></tr>`).join("")
    || `<tr><td colspan="4">No hay gastos tuyos en este periodo.</td></tr>`;
  const filasCat = Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<tr><td>${esc(c)}</td><td style="text-align:right">${soles(v)}</td></tr>`).join("")
    || `<tr><td colspan="2">Sin gastos por categoría.</td></tr>`;
  return `<!doctype html><html><head><meta charset="utf-8"><title>Resumen ${esc(rango)}</title>
  <style>
    @page{size:A4;margin:16mm}
    body{font-family:Arial,sans-serif;color:#4a1038;margin:0;padding:24px}
    h1{color:#e6007e;margin:0 0 4px} .sub{color:#a0457a;margin-bottom:18px}
    .kpis{display:flex;gap:12px;margin-bottom:18px}
    .kpi{flex:1;border:2px solid #ffb3dd;border-radius:14px;padding:12px;background:#fff0fa}
    .kpi b{display:block;font-size:1.25rem;color:#e6007e}
    table{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:.92rem}
    th,td{border-bottom:1px solid #ffd1ea;padding:6px 8px;text-align:left}
    th{background:#ffe0f3}
    h2{color:#c4006a;font-size:1.1rem;margin:18px 0 8px}
  </style></head><body>
  <h1>🎀 Mis gastos</h1>
  <div class="sub">Resumen: ${esc(rango)}</div>
  <div class="kpis">
    <div class="kpi">Ingresos<b>${soles(ing)}</b></div>
    <div class="kpi">Tus gastos<b>${soles(total)}</b></div>
    <div class="kpi">Te sobra<b>${soles(ing - total)}</b></div>
  </div>
  <h2>Gastos por categoría (tuyos)</h2>
  <table><tr><th>Categoría</th><th style="text-align:right">Total</th></tr>${filasCat}</table>
  <h2>Detalle de gastos</h2>
  <table><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th style="text-align:right">Monto</th></tr>${filas}</table>
  <p style="color:#a0457a;font-size:.8rem">Los gastos fijos y los ingresos se cuentan por mes completo.</p>
  </body></html>`;
}
function abrirResumen(m1, m2){
  if(m1 > m2){ toast("El mes de inicio debe ser anterior al final ⚠️"); return; }
  const w = window.open("", "_blank");
  if(!w){ toast("Permite las ventanas emergentes para ver el resumen"); return; }
  w.document.write(resumenDoc(m1, m2));
  w.document.close();
  w.onload = () => w.print();
  setTimeout(() => { try{ w.print(); }catch(e){} }, 400);
}
const opcionesMes = sel => MESES.map((n, i) => `<option value="${i + 1}" ${i + 1 === sel ? "selected" : ""}>${n}</option>`).join("");

      </div>
      <h3 class="subtit">🎯 Rango personalizado</h3>
      <div class="form">
        <div><label>Desde</label><select id="res-desde">${opcionesMes(ui.mes)}</select></div>
        <div><label>Hasta</label><select id="res-hasta">${opcionesMes(ui.mes)}</select></div>
        <button class="btn" data-act="resumen-rango">Descargar 📄</button>
      </div>`;
    document.getElementById("overlay").classList.add("abierto");
  },
  "resumen-rapido"(el){ document.getElementById("overlay").classList.remove("abierto"); abrirResumen(+el.dataset.d, +el.dataset.h); },

  },

});
