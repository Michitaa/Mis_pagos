/* ===== Estela (estrellitas en Scene, burbujas en Messenger) ===== */
document.addEventListener("DOMContentLoaded", function(){
  const parts = [];
  const curM = document.getElementById("cur-msn");
  /* Scene: los ojos cambian de lugar cada 2 s (alternando dos cursores) */
  setInterval(() => {
    const b = document.body;
    if(b.classList.contains("scene") && EFECTOS.on) b.classList.toggle("ojos-b"); else b.classList.remove("ojos-b");
  }, 2000);
  /* Burbuja dibujada una sola vez; luego solo se copia (mucho más liviano) */
  const BUR = document.createElement("canvas"); BUR.width = BUR.height = 32;
  (function(){
    const b = BUR.getContext("2d"), gr = b.createRadialGradient(11, 11, 1.5, 16, 16, 15);
    gr.addColorStop(0, "rgba(255,255,255,.95)"); gr.addColorStop(.5, "rgba(143,220,255,.28)"); gr.addColorStop(1, "rgba(42,163,234,.4)");
    b.fillStyle = gr; b.beginPath(); b.arc(16, 16, 14.5, 0, Math.PI * 2); b.fill();
    b.strokeStyle = "rgba(22,115,184,.6)"; b.lineWidth = 1.5; b.stroke();
  })();
  let mx = 0, my = 0, pendiente = false;
  const cv = document.getElementById("estela"), cx = cv.getContext("2d");
  const ROSAS = ["#ff1493", "#ff4fb8", "#e6007e", "#ff85cf"];
  let ux = null, uy = null;
  const modo = () => document.body.classList.contains("scene") ? "scene" : document.body.classList.contains("msn") ? "msn" : null;
  function ajustar(){ cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener("resize", ajustar); ajustar();
  function soltar(x, y, fuerza){
    const m = modo(); if(!m || !EFECTOS.on) return;
    const f = fuerza || 1;
    if(m === "scene") parts.push({tipo: "estrella", x: x + (Math.random() - .5) * 10, y: y + (Math.random() - .5) * 10,
      vx: (Math.random() - .5) * 2.2 * f, vy: (-Math.random() * 1.6 - .3) * f, g: .07,
      r: 3 + Math.random() * 5, rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .25, vida: 1, baja: .018,
      color: ROSAS[Math.floor(Math.random() * ROSAS.length)]});
    else parts.push({tipo: "burbuja", x: x + (Math.random() - .5) * 12, y: y + (Math.random() - .5) * 8,
      vx: (Math.random() - .5) * .8 * f, vy: (-Math.random() * 1.1 - .4) * f, g: -.012,
      r: 2.5 + Math.random() * 5, fase: Math.random() * 6, vida: 1, baja: .014});
    if(parts.length > 180) parts.shift();
  }
  function mover(x, y){
    mx = x; my = y;
    if(!pendiente){ pendiente = true; requestAnimationFrame(() => { pendiente = false; curM.style.transform = "translate(" + (mx + 18) + "px," + (my + 3) + "px)"; }); }
    curM.classList.add("visible");
    const d = ux === null ? 99 : Math.hypot(x - ux, y - uy);
    if(d > 6){ soltar(x, y); if(d > 30) soltar(x, y); ux = x; uy = y; }
  }
  document.addEventListener("pointermove", e => { if(e.pointerType === "mouse") mover(e.clientX, e.clientY); });
  document.addEventListener("mouseout", e => { if(!e.relatedTarget) curM.classList.remove("visible"); });
  /* En celular/tablet: lluvia de estrellitas o burbujas donde tocas, y estela al deslizar */
  document.addEventListener("pointerdown", e => {
    if(e.pointerType === "mouse") return;
    for(let i = 0; i < 9; i++) soltar(e.clientX, e.clientY, 1.8);
    ux = e.clientX; uy = e.clientY;
  }, {passive: true});
  document.addEventListener("pointermove", e => {
    if(e.pointerType === "mouse") return;
    const d = ux === null ? 99 : Math.hypot(e.clientX - ux, e.clientY - uy);
    if(d > 10){ soltar(e.clientX, e.clientY); ux = e.clientX; uy = e.clientY; }
  }, {passive: true});
  function estrella(x, y, r, rot){
    cx.beginPath();
    for(let i = 0; i < 10; i++){
      const rad = i % 2 ? r * .45 : r, a = rot + i * Math.PI / 5 - Math.PI / 2;
      cx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    cx.closePath();
  }
  let limpio = true;
  (function bucle(){
    requestAnimationFrame(bucle);
    if(!modo() || !EFECTOS.on){ if(!limpio){ parts.length = 0; cx.clearRect(0, 0, cv.width, cv.height); limpio = true; } return; }
    if(!parts.length && limpio) return;
    cx.clearRect(0, 0, cv.width, cv.height); limpio = !parts.length;
    for(let i = parts.length - 1; i >= 0; i--){
      const s = parts[i];
      s.x += s.vx; s.y += s.vy; s.vy += s.g; s.vida -= s.baja;
      if(s.vida <= 0){ parts.splice(i, 1); continue; }
      cx.globalAlpha = Math.min(1, s.vida * 1.4);
      if(s.tipo === "estrella"){
        s.rot += s.vr;
        cx.fillStyle = s.color; cx.shadowColor = "#ff1493"; cx.shadowBlur = 8;
        estrella(s.x, s.y, s.r * (.6 + s.vida * .4), s.rot); cx.fill();
      }else{
        s.fase += .12; const x = s.x + Math.sin(s.fase) * 1.4, r = s.r * (.8 + (1 - s.vida) * .5);
        cx.shadowBlur = 0;
        cx.drawImage(BUR, x - r, s.y - r, r * 2, r * 2);
      }
    }
    cx.globalAlpha = 1; cx.shadowBlur = 0;
  })();
});

/* ===== Resúmenes en PDF (elige mes, año o rango) ===== */
function resumenDoc(m1, m2){
  let gastos = [], ing = 0, fijos = 0;
  for(let m = m1; m <= m2; m++){
    gastos.push(...gastosMes(m).map(g => ({...g, _m: m})));
    ing += totalIngresosMes(m);
    fijos += fijosMio(m);
  }
  const tuyos = gastos.filter(esMio).sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
  const varTuyos = sumar(tuyos);
  const total = varTuyos + fijos;
  const cats = {};
  tuyos.forEach(g => { cats[g.cat || "Otros"] = (cats[g.cat || "Otros"] || 0) + num(g.monto); });
  const rango = m1 === m2 ? MESES[m1 - 1] + " " + S.anio : MESES[m1 - 1] + " – " + MESES[m2 - 1] + " " + S.anio;
  const filas = tuyos.map(g => `<tr><td>${esc(g.fecha)}</td><td>${esc(g.desc)}</td><td>${esc(g.cat || "")}</td><td style="text-align:right">${soles(g.monto)}</td></tr>`).join("")
    || `<tr><td colspan="4">No hay gastos tuyos en este periodo.</td></tr>`;
  const filasCat = Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<tr><td>${esc(c)}</td><td style="text-align:right">${soles(v)}</td></tr>`).join("")
    || `<tr><td colspan="2">Sin gastos por categoría.</td></tr>`;
  return `<!doctype html><html><head><meta charset="utf-8"><title>Resumen ${esc(rango)}</title>
  <style>
    @page{size:A4;margin:16mm}
    body{font-family:Arial,sans-serif;color:#4a1038;margin:0;padding:24px}
    h1{color:#e6007e;margin:0 0 4px} .sub{color:#a0457a;margin-bottom:18px}
    .kpis{display:flex;gap:12px;margin-bottom:18px}
    .kpi{flex:1;border:2px solid #ffb3dd;border-radius:14px;padding:12px;background:#fff0fa}
    .kpi b{display:block;font-size:1.25rem;color:#e6007e}
    table{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:.92rem}
    th,td{border-bottom:1px solid #ffd1ea;padding:6px 8px;text-align:left}
    th{background:#ffe0f3}
    h2{color:#c4006a;font-size:1.1rem;margin:18px 0 8px}
  </style></head><body>
  <h1>🎀 Mis gastos</h1>
  <div class="sub">Resumen: ${esc(rango)}</div>
  <div class="kpis">
    <div class="kpi">Ingresos<b>${soles(ing)}</b></div>
    <div class="kpi">Tus gastos<b>${soles(total)}</b></div>
    <div class="kpi">Te sobra<b>${soles(ing - total)}</b></div>
  </div>
  <h2>Gastos por categoría (tuyos)</h2>
  <table><tr><th>Categoría</th><th style="text-align:right">Total</th></tr>${filasCat}</table>
  <h2>Detalle de gastos</h2>
  <table><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th style="text-align:right">Monto</th></tr>${filas}</table>
  <p style="color:#a0457a;font-size:.8rem">Los gastos fijos y los ingresos se cuentan por mes completo.</p>
  </body></html>`;
}
function abrirResumen(m1, m2){
  if(m1 > m2){ toast("El mes de inicio debe ser anterior al final ⚠️"); return; }
  const w = window.open("", "_blank");
  if(!w){ toast("Permite las ventanas emergentes para ver el resumen"); return; }
  w.document.write(resumenDoc(m1, m2));
  w.document.close();
  w.onload = () => w.print();
  setTimeout(() => { try{ w.print(); }catch(e){} }, 400);
}
const opcionesMes = sel => MESES.map((n, i) => `<option value="${i + 1}" ${i + 1 === sel ? "selected" : ""}>${n}</option>`).join("");
Object.assign(ACCIONES, {
  "resumen-pdf"(){
    document.getElementById("modal-titulo").textContent = "📄 Descargar resumen en PDF";
    document.getElementById("modal-body").innerHTML = `
      <p style="margin:0 0 12px">Elige qué resumen quieres. Se abre una ventana lista para imprimir o guardar como PDF.</p>
      <div class="chips" style="margin-bottom:16px">
        <button class="btn" data-act="resumen-rapido" data-d="${ui.mes}" data-h="${ui.mes}">📅 Solo ${MESES[ui.mes - 1]}</button>
        <button class="btn" data-act="resumen-rapido" data-d="1" data-h="12">🗓️ Año completo ${S.anio}</button>
      </div>
      <h3 class="subtit">🎯 Rango personalizado</h3>
      <div class="form">
        <div><label>Desde</label><select id="res-desde">${opcionesMes(ui.mes)}</select></div>
        <div><label>Hasta</label><select id="res-hasta">${opcionesMes(ui.mes)}</select></div>
        <button class="btn" data-act="resumen-rango">Descargar 📄</button>
      </div>`;
    document.getElementById("overlay").classList.add("abierto");
  },
  "resumen-rapido"(el){ document.getElementById("overlay").classList.remove("abierto"); abrirResumen(+el.dataset.d, +el.dataset.h); },
  "resumen-rango"(){
    document.getElementById("overlay").classList.remove("abierto");
    abrirResumen(+document.getElementById("res-desde").value, +document.getElementById("res-hasta").value);
  },
  imprimir(){ document.getElementById("modal-titulo").textContent = ""; ACCIONES["resumen-pdf"](); }
});
</script>
